<!-- 그림 1: GGUF 파일 이름과 Ollama 태그를 조각으로 나누어 대응시킨 표 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">모델 파일 이름을 이루는 조각</title>
  <desc id="fig1-desc">Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf는 기본 이름 Meta-Llama-3.1, 크기 8B, 미세 조정 Instruct, 인코딩 Q4_K_M, 확장자 gguf로 나뉩니다. 같은 모델의 Ollama 태그 llama3.1:8b-instruct-q4_K_M은 llama3.1, 8b, instruct, q4_K_M으로 대응합니다.</desc>

  <rect width="1200" height="840" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="838" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="96" font-size="40" font-weight="700" fill="#1e293b">모델 파일 이름을 이루는 조각</text>
    <text x="64" y="144" font-size="26" fill="#475569">같은 모델이라도 배포처마다 적는 모양이 조금씩 다릅니다</text>

    <text x="64" y="204" font-size="24" font-weight="700" fill="#334155">GGUF 파일 이름 (Hugging Face)</text>
    <text x="64" y="324" font-size="24" font-weight="700" fill="#334155">Ollama 태그</text>
  </g>

  <!-- 파일 이름 조각 -->
  <g stroke-width="2">
    <rect x="64" y="220" width="300" height="56" rx="10" fill="#e2e8f0" stroke="#64748b" />
    <rect x="396" y="220" width="84" height="56" rx="10" fill="#ccfbf1" stroke="#0f766e" />
    <rect x="512" y="220" width="192" height="56" rx="10" fill="#dbeafe" stroke="#1d4ed8" />
    <rect x="736" y="220" width="156" height="56" rx="10" fill="#ede9fe" stroke="#6d28d9" />
    <rect x="908" y="220" width="138" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4" />
  </g>
  <!-- Ollama 태그 조각 -->
  <g stroke-width="2">
    <rect x="64" y="340" width="192" height="56" rx="10" fill="#e2e8f0" stroke="#64748b" />
    <rect x="288" y="340" width="84" height="56" rx="10" fill="#ccfbf1" stroke="#0f766e" />
    <rect x="404" y="340" width="192" height="56" rx="10" fill="#dbeafe" stroke="#1d4ed8" />
    <rect x="628" y="340" width="156" height="56" rx="10" fill="#ede9fe" stroke="#6d28d9" />
  </g>

  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="30" fill="#0f172a" text-anchor="middle">
    <text x="214" y="259">Meta-Llama-3.1</text>
    <text x="380" y="259" fill="#64748b">-</text>
    <text x="438" y="259">8B</text>
    <text x="496" y="259" fill="#64748b">-</text>
    <text x="608" y="259">Instruct</text>
    <text x="720" y="259" fill="#64748b">-</text>
    <text x="814" y="259">Q4_K_M</text>
    <text x="977" y="259">.gguf</text>

    <text x="160" y="379">llama3.1</text>
    <text x="272" y="379" fill="#64748b">:</text>
    <text x="330" y="379">8b</text>
    <text x="388" y="379" fill="#64748b">-</text>
    <text x="500" y="379">instruct</text>
    <text x="612" y="379" fill="#64748b">-</text>
    <text x="706" y="379">q4_K_M</text>
  </g>

  <!-- 해석 표 -->
  <line x1="64" y1="440" x2="1136" y2="440" stroke="#cbd5e1" stroke-width="2" />
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#475569">
    <text x="64" y="480">조각</text>
    <text x="352" y="480">뜻</text>
    <text x="824" y="480">Ollama 태그에서</text>
  </g>
  <line x1="64" y1="500" x2="1136" y2="500" stroke="#cbd5e1" stroke-width="2" />

  <g stroke-width="2">
    <rect x="64" y="522" width="24" height="24" rx="4" fill="#e2e8f0" stroke="#64748b" />
    <rect x="64" y="582" width="24" height="24" rx="4" fill="#ccfbf1" stroke="#0f766e" />
    <rect x="64" y="642" width="24" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8" />
    <rect x="64" y="702" width="24" height="24" rx="4" fill="#ede9fe" stroke="#6d28d9" />
    <rect x="64" y="762" width="24" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3" />
  </g>
  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="24" fill="#0f172a">
    <text x="104" y="543">Meta-Llama-3.1</text>
    <text x="104" y="603">8B</text>
    <text x="104" y="663">Instruct</text>
    <text x="104" y="723">Q4_K_M</text>
    <text x="104" y="783">.gguf</text>
    <text x="824" y="543">llama3.1</text>
    <text x="824" y="603">8b</text>
    <text x="824" y="663">instruct</text>
    <text x="824" y="723">q4_K_M</text>
  </g>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" font-size="24" fill="#1e293b">
    <text x="352" y="543"><tspan font-weight="700">기본 이름</tspan> · 모델 계열과 세대</text>
    <text x="352" y="603"><tspan font-weight="700">크기</tspan> · 파라미터 약 80억 개</text>
    <text x="352" y="663"><tspan font-weight="700">미세 조정</tspan> · 대화용으로 다듬은 판</text>
    <text x="352" y="723"><tspan font-weight="700">인코딩</tspan> · 4비트 k-quant, 중간 혼합</text>
    <text x="352" y="783"><tspan font-weight="700">형식</tspan> · llama.cpp용 GGUF 파일</text>
    <text x="960" y="663" fill="#475569">(베이스는 text)</text>
    <text x="824" y="783" fill="#475569">태그에 없음</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="2">
    <line x1="64" y1="560" x2="1136" y2="560" />
    <line x1="64" y1="620" x2="1136" y2="620" />
    <line x1="64" y1="680" x2="1136" y2="680" />
    <line x1="64" y1="740" x2="1136" y2="740" />
  </g>
</svg>
