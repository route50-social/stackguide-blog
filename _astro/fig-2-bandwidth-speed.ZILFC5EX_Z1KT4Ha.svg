<!-- 그림 2: llama.cpp Apple Silicon 측정표(Llama 2 7B Q4_0, tg128)의 생성 속도와 메모리 대역폭으로 계산한 이론 상한 비교 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">메모리 대역폭과 글 생성 속도</title>
  <desc id="fig2-desc">Llama 2 7B Q4_0(3.56GiB)을 llama.cpp로 실행한 글 생성 속도 실측값과, 메모리 대역폭을 모델 크기로 나눈 이론 상한(초당 토큰): M1 8코어 68GB/s 14.2 대 17.8, M2 10코어 100GB/s 21.9 대 26.2, M4 10코어 120GB/s 24.1 대 31.4, M4 Pro 20코어 273GB/s 50.7 대 71.4, M3 Max 40코어 400GB/s 66.3 대 104.6, M4 Max 40코어 546GB/s 83.1 대 142.8. 대역폭이 클수록 빨라지며, 실측값은 상한의 58~84% 수준입니다.</desc>

  <rect width="1200" height="840" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="838" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="96" font-size="38" font-weight="700" fill="#1e293b">메모리 대역폭과 글 생성 속도</text>
    <text x="64" y="140" font-size="24" fill="#475569">Llama 2 7B Q4_0(3.56GiB), llama.cpp 글 생성(tg128), 코어 수는 GPU 기준</text>

    <!-- 범례 -->
    <rect x="64" y="172" width="40" height="24" rx="4" fill="#0d9488" />
    <text x="116" y="192" font-size="22" fill="#334155">실측</text>
    <rect x="200" y="172" width="40" height="24" rx="4" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" />
    <text x="252" y="192" font-size="22" fill="#334155">이론 상한 = 대역폭 ÷ 모델 크기(필자 계산)</text>
    <text x="1136" y="192" text-anchor="end" font-size="22" font-weight="700" fill="#475569">실측 / 상한</text>

    <!-- 눈금: 0~150 t/s, 1 t/s = 4px, 시작 x=320 -->
    <g stroke="#e2e8f0" stroke-width="2">
      <line x1="520" y1="224" x2="520" y2="728" />
      <line x1="720" y1="224" x2="720" y2="728" />
      <line x1="920" y1="224" x2="920" y2="728" />
    </g>
    <line x1="320" y1="224" x2="320" y2="728" stroke="#94a3b8" stroke-width="2" />
    <g font-size="22" fill="#475569" text-anchor="middle">
      <text x="320" y="760">0</text>
      <text x="520" y="760">50</text>
      <text x="720" y="760">100</text>
      <text x="920" y="760">150</text>
    </g>
    <text x="620" y="800" text-anchor="middle" font-size="22" fill="#475569">초당 토큰(t/s)</text>

    <!-- 행: 높이 84, 막대 높이 40 -->
    <g font-size="24" fill="#1e293b" text-anchor="end">
      <text x="296" y="262">M1 8코어</text>
      <text x="296" y="346">M2 10코어</text>
      <text x="296" y="430">M4 10코어</text>
      <text x="296" y="514">M4 Pro 20코어</text>
      <text x="296" y="598">M3 Max 40코어</text>
      <text x="296" y="682">M4 Max 40코어</text>
    </g>
    <g font-size="20" fill="#475569" text-anchor="end">
      <text x="296" y="288">68GB/s</text>
      <text x="296" y="372">100GB/s</text>
      <text x="296" y="456">120GB/s</text>
      <text x="296" y="540">273GB/s</text>
      <text x="296" y="624">400GB/s</text>
      <text x="296" y="708">546GB/s</text>
    </g>

    <!-- 이론 상한(점선 테두리) -->
    <g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4">
      <rect x="320" y="244" width="71.2" height="40" rx="4" />
      <rect x="320" y="328" width="104.6" height="40" rx="4" />
      <rect x="320" y="412" width="125.6" height="40" rx="4" />
      <rect x="320" y="496" width="285.6" height="40" rx="4" />
      <rect x="320" y="580" width="418.6" height="40" rx="4" />
      <rect x="320" y="664" width="571.4" height="40" rx="4" />
    </g>
    <!-- 실측 -->
    <g fill="#0d9488">
      <rect x="320" y="248" width="56.6" height="32" rx="3" />
      <rect x="320" y="332" width="87.6" height="32" rx="3" />
      <rect x="320" y="416" width="96.4" height="32" rx="3" />
      <rect x="320" y="500" width="203.0" height="32" rx="3" />
      <rect x="320" y="584" width="265.2" height="32" rx="3" />
      <rect x="320" y="668" width="332.2" height="32" rx="3" />
    </g>

    <g font-size="24" fill="#1e293b" text-anchor="end">
      <text x="1136" y="273">14.2 / 17.8</text>
      <text x="1136" y="357">21.9 / 26.2</text>
      <text x="1136" y="441">24.1 / 31.4</text>
      <text x="1136" y="525">50.7 / 71.4</text>
      <text x="1136" y="609">66.3 / 104.6</text>
      <text x="1136" y="693">83.1 / 142.8</text>
    </g>
  </g>
</svg>
