<!-- 그림 2: CPU 여유분(크레딧·버스트 용량)을 다 쓴 뒤 Lightsail, EC2 Standard, EC2 Unlimited의 동작 비교 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">CPU 여유분을 다 쓴 뒤의 동작 비교</title>
  <desc id="fig2-desc">CPU 여유분을 모두 쓰면 Lightsail과 EC2 Standard 모드는 CPU 사용률이 기준 성능까지 내려가 느려지지만 추가 요금은 없습니다. t3·t4g의 기본값인 EC2 Unlimited 모드는 높은 성능을 유지하는 대신 24시간 평균이 기준을 넘은 만큼 vCPU시간당 추가 요금(서울 리전 리눅스 t4g 0.04달러, t3 0.05달러)이 붙습니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M5 2 L12 7 L5 12" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    </marker>
  </defs>

  <rect width="1200" height="680" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="678" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="88" font-size="36" font-weight="700" fill="#1e293b">CPU 여유분을 다 쓰면 어떻게 되나</text>
    <text x="64" y="132" font-size="24" fill="#475569">느려지거나, 요금을 더 내거나 둘 중 하나입니다</text>

    <!-- 출발 상자 -->
    <rect x="384" y="168" width="432" height="64" rx="32" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text x="600" y="209" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">크레딧·버스트 용량 0</text>

    <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M520 232 L232 272" />
      <path d="M600 232 V272" />
      <path d="M680 232 L968 272" />
    </g>

    <!-- 세 갈래 상자: 같은 크기 336×320, 간격 32 -->
    <g stroke-width="2">
      <rect x="64" y="280" width="336" height="320" rx="16" fill="#f1f5f9" stroke="#94a3b8" />
      <rect x="432" y="280" width="336" height="320" rx="16" fill="#f1f5f9" stroke="#94a3b8" />
      <rect x="800" y="280" width="336" height="320" rx="16" fill="#fffbeb" stroke="#f59e0b" />
    </g>
    <g font-size="28" font-weight="700" fill="#1e293b">
      <text x="96" y="328">Lightsail</text>
      <text x="464" y="328">EC2 Standard</text>
      <text x="832" y="328">EC2 Unlimited</text>
    </g>
    <g font-size="22" fill="#475569">
      <text x="96" y="360">모든 버스터블 플랜</text>
      <text x="464" y="360">직접 바꿔야 적용</text>
      <text x="832" y="360">t3·t4g 기본값</text>
    </g>

    <!-- 작은 그래프: 기준선 y=470 (점선), 높은 사용률 y=402 -->
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
      <rect x="96" y="384" width="272" height="104" rx="8" />
      <rect x="464" y="384" width="272" height="104" rx="8" />
      <rect x="832" y="384" width="272" height="104" rx="8" />
    </g>
    <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6">
      <path d="M104 464 H360" />
      <path d="M472 464 H728" />
      <path d="M840 464 H1096" />
    </g>
    <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M104 404 H224 L244 464 H360" stroke="#475569" />
      <path d="M472 404 H592 L612 464 H728" stroke="#475569" />
      <path d="M840 404 H1096" stroke="#b45309" />
    </g>
    <path d="M960 404 V464" stroke="#f59e0b" stroke-width="2" />
    <rect x="964" y="404" width="132" height="60" fill="#f59e0b" opacity="0.18" />

    <!-- 결과 -->
    <g font-size="22" font-weight="700">
      <text x="96" y="532" fill="#475569">기준 성능으로 느려짐</text>
      <text x="464" y="532" fill="#475569">기준 성능으로 느려짐</text>
      <text x="832" y="532" fill="#b45309">⚠ 성능 유지, 추가 요금</text>
    </g>
    <g font-size="22" fill="#334155">
      <text x="96" y="568">추가 요금 없음</text>
      <text x="464" y="568">추가 요금 없음</text>
      <text x="832" y="568">vCPU시간당 $0.04~$0.05</text>
    </g>

    <!-- 범례 -->
    <g font-size="22" fill="#334155">
      <path d="M64 636 H112" stroke="#475569" stroke-width="4" />
      <text x="128" y="644">CPU 사용률</text>
      <path d="M304 636 H352" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6" />
      <text x="368" y="644">기준 성능</text>
      <rect x="520" y="624" width="48" height="24" fill="#f59e0b" opacity="0.18" stroke="#f59e0b" stroke-width="2" />
      <text x="584" y="644">기준 초과분 (24시간 평균으로 정산, 서울 리전 리눅스)</text>
    </g>
  </g>
</svg>
