<!-- 표지: 진열대 위의 원석, 반쯤 깎은 보석, 다 깎아 빛나는 보석. 거친 재료를 여러 단계로 다듬어 쓸모 있는 모델을 만드는 LLM 학습 과정을 상징 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">원석에서 완성된 보석까지 세 단계</title>
  <desc id="cover-desc">짙은 남보라색 배경 아래 어두운 벨벳 진열대 위에 세 개의 돌이 왼쪽부터 놓여 있습니다. 왼쪽은 작은 결정이 삐죽 솟은 거친 원석, 가운데는 한쪽만 면을 깎은 반쯤 다듬은 보석, 오른쪽은 위에서 내려오는 조명을 받아 반짝이는 완성된 청록색 보석입니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1236" />
      <stop offset="0.6" stop-color="#26174a" />
      <stop offset="1" stop-color="#140c28" />
    </linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2466" />
      <stop offset="0.35" stop-color="#2a1a4d" />
      <stop offset="1" stop-color="#120a22" />
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.3" />
      <stop offset="0.7" stop-color="#a5f3fc" stop-opacity="0.08" />
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.45" />
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.12" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.5" />
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.16" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b6480" />
      <stop offset="1" stop-color="#3b3550" />
    </linearGradient>
    <linearGradient id="rockShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="crystalDull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8fa6" />
      <stop offset="1" stop-color="#4b5a70" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- 배경과 흐릿한 빛 망울 -->
  <rect width="1600" height="900" fill="url(#bg)" />
  <g fill="#8b5cf6" opacity="0.12" filter="url(#soft)">
    <circle cx="260" cy="200" r="90" />
    <circle cx="1380" cy="150" r="120" />
    <circle cx="760" cy="120" r="70" />
  </g>

  <!-- 벨벳 진열대 -->
  <path d="M0 600 C 400 570, 1200 570, 1600 600 L1600 900 L0 900 Z" fill="url(#velvet)" />
  <path d="M0 600 C 400 570, 1200 570, 1600 600" fill="none" stroke="#5b3d99" stroke-width="3" opacity="0.6" />

  <!-- 오른쪽 보석 위로 내려오는 조명 -->
  <polygon points="1060,0 1240,0 1360,900 940,900" fill="url(#beam)" />
  <ellipse cx="1150" cy="672" rx="230" ry="44" fill="url(#pool)" />

  <!-- 그림자 -->
  <g fill="#05030c" opacity="0.7" filter="url(#shadow)">
    <ellipse cx="470" cy="668" rx="150" ry="22" />
    <ellipse cx="800" cy="668" rx="125" ry="20" />
    <ellipse cx="1150" cy="676" rx="160" ry="22" />
  </g>

  <!-- 1. 거친 원석 -->
  <g>
    <polygon points="352,656 340,600 372,548 430,520 506,526 566,560 590,616 576,658" fill="url(#rock)" />
    <polygon points="506,526 566,560 590,616 576,658 520,658 530,590" fill="url(#rockShade)" />
    <polygon points="372,548 430,520 470,560 410,590" fill="#857e99" opacity="0.6" />
    <!-- 솟은 결정: 끝이 뾰족한 육각기둥 -->
    <polygon points="418,544 428,470 448,440 468,462 470,536" fill="url(#crystalDull)" />
    <polygon points="428,470 448,440 452,474 434,482" fill="#a7b5c7" />
    <polygon points="482,532 494,486 516,462 530,488 518,536" fill="url(#crystalDull)" />
    <polygon points="494,486 516,462 512,494" fill="#a7b5c7" />
    <polygon points="380,562 372,520 386,498 402,520 406,556" fill="url(#crystalDull)" opacity="0.9" />
    <polygon points="372,520 386,498 388,526" fill="#a7b5c7" opacity="0.9" />
    <g fill="#2c2740" opacity="0.6">
      <circle cx="400" cy="620" r="6" />
      <circle cx="470" cy="610" r="4" />
      <circle cx="540" cy="630" r="5" />
      <circle cx="510" cy="590" r="3" />
    </g>
  </g>

  <!-- 2. 반쯤 깎은 보석: 왼쪽은 거친 면, 오른쪽은 깎은 면 -->
  <g>
    <polygon points="690,600 702,560 742,528 800,522 800,664 744,660 700,640" fill="#5a6a86" />
    <polygon points="702,560 742,528 776,548 732,580" fill="#73839f" />
    <polygon points="700,640 732,580 776,600 744,660" fill="#47546c" />
    <!-- 깎은 오른쪽 절반 -->
    <polygon points="800,522 860,522 910,576 800,576" fill="#38bdf8" />
    <polygon points="800,522 836,522 820,576 800,576" fill="#7dd3fc" />
    <polygon points="860,522 910,576 870,576" fill="#0ea5e9" />
    <polygon points="800,576 910,576 800,666" fill="#0369a1" />
    <polygon points="800,576 860,576 800,666" fill="#0284c7" />
    <line x1="800" y1="522" x2="800" y2="666" stroke="#1e293b" stroke-width="2" opacity="0.5" />
  </g>

  <!-- 3. 완성된 보석 -->
  <ellipse cx="1150" cy="520" rx="240" ry="200" fill="url(#halo)" />
  <g stroke="#cffafe" stroke-width="1.5" stroke-linejoin="round">
    <!-- 크라운 -->
    <polygon points="1000,500 1075,430 1112,430 1075,500" fill="#22d3ee" />
    <polygon points="1075,500 1112,430 1150,430 1150,500" fill="#67e8f9" />
    <polygon points="1150,500 1150,430 1188,430 1225,500" fill="#a5f3fc" />
    <polygon points="1225,500 1188,430 1225,430 1300,500" fill="#06b6d4" />
    <!-- 테이블 반사 -->
    <polygon points="1075,430 1225,430 1212,420 1088,420" fill="#ecfeff" />
    <!-- 파빌리언 -->
    <polygon points="1000,500 1075,500 1150,660" fill="#0891b2" />
    <polygon points="1075,500 1150,500 1150,660" fill="#22d3ee" />
    <polygon points="1150,500 1225,500 1150,660" fill="#0e7490" />
    <polygon points="1225,500 1300,500 1150,660" fill="#155e75" />
  </g>
  <polygon points="1088,438 1130,438 1100,488 1084,488" fill="#ffffff" opacity="0.55" />

  <!-- 반짝임 -->
  <g fill="#ffffff">
    <path d="M1238 392 L1246 412 L1266 420 L1246 428 L1238 448 L1230 428 L1210 420 L1230 412 Z" opacity="0.95" />
    <path d="M1062 440 L1067 452 L1079 457 L1067 462 L1062 474 L1057 462 L1045 457 L1057 452 Z" opacity="0.8" />
    <path d="M1310 520 L1314 530 L1324 534 L1314 538 L1310 548 L1306 538 L1296 534 L1306 530 Z" opacity="0.7" />
  </g>
  <g fill="#a5f3fc" opacity="0.6">
    <circle cx="1020" cy="400" r="3" />
    <circle cx="1290" cy="450" r="3" />
    <circle cx="1180" cy="370" r="2.5" />
  </g>
</svg>
