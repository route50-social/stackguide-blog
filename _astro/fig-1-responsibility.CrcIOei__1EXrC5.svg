<!-- 그림 1: 웹호스팅, 관리형 앱 호스팅, 가상 서버에서 업체와 내가 관리하는 범위 비교 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">호스팅 방식별 관리 범위</title>
  <desc id="fig1-desc">다섯 층으로 나눈 관리 항목을 세 방식으로 비교합니다. 웹호스팅은 내 코드와 데이터만 직접 관리하고, 관리형 앱 호스팅은 배포·확장 설정과 코드를 직접 관리하며, 가상 서버는 하드웨어·네트워크를 뺀 운영체제, 웹 서버·런타임, 배포·확장 설정, 코드를 모두 직접 관리합니다.</desc>
  <defs>
    <pattern id="vendor-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f1f5f9" />
      <line x1="0" y1="0" x2="0" y2="16" stroke="#cbd5e1" stroke-width="6" />
    </pattern>
  </defs>

  <rect width="1200" height="760" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="758" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="96" font-size="38" font-weight="700" fill="#1e293b">호스팅 방식별로 내가 맡는 범위</text>
    <text x="64" y="140" font-size="24" fill="#475569">아래에서 위로 갈수록 서비스에 가까운 층입니다</text>

    <!-- 열 제목 -->
    <g font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">
      <text x="496" y="208">웹호스팅</text>
      <text x="760" y="208">관리형 앱 호스팅</text>
      <text x="1016" y="208">가상 서버</text>
    </g>
    <g font-size="22" fill="#475569" text-anchor="middle">
      <text x="496" y="240">공유 서버</text>
      <text x="760" y="240">PaaS</text>
      <text x="1016" y="240">VPS·클라우드 VM</text>
    </g>

    <!-- 행 이름 (위에서 아래: 서비스에 가까운 층 → 하드웨어) -->
    <g font-size="24" fill="#1e293b">
      <text x="64" y="309">내 코드·데이터</text>
      <text x="64" y="389">배포·확장 설정</text>
      <text x="64" y="469">웹 서버·언어 런타임</text>
      <text x="64" y="549">운영체제·보안 패치</text>
      <text x="64" y="629">하드웨어·네트워크</text>
    </g>

    <!-- 칸: 너비 224, 높이 64, 세로 간격 16 -->
    <!-- 웹호스팅 -->
    <rect x="384" y="272" width="224" height="64" rx="10" fill="#2563eb" />
    <rect x="384" y="352" width="224" height="64" rx="10" fill="url(#vendor-hatch)" stroke="#94a3b8" stroke-width="2" />
    <rect x="384" y="432" width="224" height="64" rx="10" fill="url(#vendor-hatch)" stroke="#94a3b8" stroke-width="2" />
    <rect x="384" y="512" width="224" height="64" rx="10" fill="url(#vendor-hatch)" stroke="#94a3b8" stroke-width="2" />
    <rect x="384" y="592" width="224" height="64" rx="10" fill="url(#vendor-hatch)" stroke="#94a3b8" stroke-width="2" />
    <!-- 관리형 앱 호스팅 -->
    <rect x="648" y="272" width="224" height="64" rx="10" fill="#2563eb" />
    <rect x="648" y="352" width="224" height="64" rx="10" fill="#2563eb" />
    <rect x="648" y="432" width="224" height="64" rx="10" fill="url(#vendor-hatch)" stroke="#94a3b8" stroke-width="2" />
    <rect x="648" y="512" width="224" height="64" rx="10" fill="url(#vendor-hatch)" stroke="#94a3b8" stroke-width="2" />
    <rect x="648" y="592" width="224" height="64" rx="10" fill="url(#vendor-hatch)" stroke="#94a3b8" stroke-width="2" />
    <!-- 가상 서버 -->
    <rect x="904" y="272" width="224" height="64" rx="10" fill="#2563eb" />
    <rect x="904" y="352" width="224" height="64" rx="10" fill="#2563eb" />
    <rect x="904" y="432" width="224" height="64" rx="10" fill="#2563eb" />
    <rect x="904" y="512" width="224" height="64" rx="10" fill="#2563eb" />
    <rect x="904" y="592" width="224" height="64" rx="10" fill="url(#vendor-hatch)" stroke="#94a3b8" stroke-width="2" />

    <!-- 칸 글자 -->
    <g font-size="24" font-weight="700" text-anchor="middle">
      <g fill="#ffffff">
        <text x="496" y="313">직접</text>
        <text x="760" y="313">직접</text>
        <text x="760" y="393">직접</text>
        <text x="1016" y="313">직접</text>
        <text x="1016" y="393">직접</text>
        <text x="1016" y="473">직접</text>
        <text x="1016" y="553">직접</text>
      </g>
      <g fill="#475569">
        <text x="496" y="393">업체 (상품 범위 안)</text>
        <text x="496" y="473">업체</text>
        <text x="496" y="553">업체</text>
        <text x="496" y="633">업체</text>
        <text x="760" y="473">업체</text>
        <text x="760" y="553">업체</text>
        <text x="760" y="633">업체</text>
        <text x="1016" y="633">업체</text>
      </g>
    </g>

    <!-- 범례 -->
    <rect x="64" y="688" width="40" height="32" rx="6" fill="#2563eb" />
    <text x="116" y="713" font-size="22" fill="#1e293b">직접 설치·관리</text>
    <rect x="320" y="688" width="40" height="32" rx="6" fill="url(#vendor-hatch)" stroke="#94a3b8" stroke-width="2" />
    <text x="372" y="713" font-size="22" fill="#1e293b">업체가 관리 (빗금)</text>
    <text x="1136" y="713" font-size="22" fill="#475569" text-anchor="end">상품마다 세부 범위는 다를 수 있음</text>
  </g>
</svg>
