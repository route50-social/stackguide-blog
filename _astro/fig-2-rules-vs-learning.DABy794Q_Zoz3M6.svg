<!-- 그림 2: 스팸 메일 분류를 예로 규칙 기반 방식과 머신러닝 방식의 흐름을 나란히 비교한 그림 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 744" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">규칙 기반 방식과 머신러닝 방식의 차이</title>
  <desc id="fig2-desc">왼쪽 규칙 기반 방식은 1단계에서 사람이 규칙을 쓰고, 2단계에서 그 규칙과 새 메일을 프로그램에 넣어, 3단계에서 스팸인지 정상인지 답을 얻습니다. 오른쪽 머신러닝 방식은 1단계에서 과거 메일과 각 메일의 정답을 준비하고, 2단계에서 이를 학습해, 3단계에서 규칙 역할을 하는 모델을 얻습니다. 새 메일은 이 모델에 넣어 판정합니다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569" />
    </marker>
  </defs>

  <rect width="1200" height="744" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="742" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="88" font-size="36" font-weight="700" fill="#1e293b">규칙을 누가 만드는가</text>
    <text x="64" y="132" font-size="24" fill="#475569">스팸 메일 분류를 예로 든 두 방식의 흐름</text>

    <!-- 왼쪽 패널: 규칙 기반 -->
    <rect x="64" y="168" width="512" height="504" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <text x="320" y="216" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">규칙 기반: 사람이 규칙을 쓴다</text>

    <!-- 오른쪽 패널: 머신러닝 -->
    <rect x="624" y="168" width="512" height="504" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2" />
    <text x="880" y="216" font-size="26" font-weight="700" fill="#1e1b4b" text-anchor="middle">머신러닝: 데이터에서 배운다</text>

    <!-- 상자들 -->
    <g stroke-width="2">
      <!-- 왼쪽 1단계 -->
      <rect x="96" y="248" width="208" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" />
      <rect x="336" y="248" width="208" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" />
      <!-- 왼쪽 2단계 -->
      <rect x="176" y="392" width="288" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" />
      <!-- 왼쪽 3단계 -->
      <rect x="176" y="536" width="288" height="80" rx="12" fill="#ffffff" stroke="#475569" />

      <!-- 오른쪽 1단계 -->
      <rect x="656" y="248" width="208" height="80" rx="12" fill="#ffffff" stroke="#818cf8" />
      <rect x="896" y="248" width="208" height="80" rx="12" fill="#ffffff" stroke="#818cf8" />
      <!-- 오른쪽 2단계 -->
      <rect x="736" y="392" width="288" height="80" rx="12" fill="#ffffff" stroke="#818cf8" />
      <!-- 오른쪽 3단계 -->
      <rect x="736" y="536" width="288" height="80" rx="12" fill="#4338ca" stroke="#312e81" />
    </g>

    <!-- 화살표 -->
    <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M200 328 L272 388" />
      <path d="M440 328 L368 388" />
      <path d="M320 472 V530" />
      <path d="M760 328 L832 388" />
      <path d="M1000 328 L928 388" />
      <path d="M880 472 V530" />
    </g>

    <!-- 단계 번호 -->
    <g font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">
      <circle cx="96" cy="248" r="18" fill="#475569" /><text x="96" y="255">1</text>
      <circle cx="176" cy="392" r="18" fill="#475569" /><text x="176" y="399">2</text>
      <circle cx="176" cy="536" r="18" fill="#475569" /><text x="176" y="543">3</text>
      <circle cx="656" cy="248" r="18" fill="#4338ca" /><text x="656" y="255">1</text>
      <circle cx="736" cy="392" r="18" fill="#4338ca" /><text x="736" y="399">2</text>
      <circle cx="736" cy="536" r="18" fill="#4338ca" /><text x="736" y="543">3</text>
    </g>

    <!-- 상자 글자 -->
    <g font-size="23" text-anchor="middle" fill="#1e293b">
      <text x="200" y="296">사람이 쓴 규칙</text>
      <text x="440" y="296">새 메일</text>
      <text x="320" y="440">프로그램이 규칙대로 판단</text>
      <text x="320" y="584" font-weight="700">답: 스팸 또는 정상</text>

      <text x="760" y="296">과거 메일 수천 통</text>
      <text x="1000" y="296">메일마다 정답 표시</text>
      <text x="880" y="440">학습: 둘을 가르는 기준 찾기</text>
      <text x="880" y="584" font-weight="700" fill="#ffffff">결과: 모델(학습된 규칙)</text>
    </g>

    <text x="880" y="640" font-size="22" fill="#3730a3" text-anchor="middle">새 메일은 이 모델에 넣어 판정합니다</text>
    <text x="320" y="640" font-size="22" fill="#475569" text-anchor="middle">규칙 밖의 메일은 사람이 규칙을 더해야 합니다</text>
  </g>
</svg>
