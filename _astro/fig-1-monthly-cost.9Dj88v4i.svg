<!-- 그림 1: 메모리 2GB 서버를 서울 리전에서 한 달(730시간) 켜 둘 때의 요금 구성. 1달러 = 25px -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">메모리 2GB 서버의 한 달 요금 구성 비교</title>
  <desc id="fig1-desc">Lightsail 2GB 플랜은 서버, SSD 60GB, 공인 IPv4, 전송 3TB를 묶어 12달러입니다. EC2 t4g.small 구성은 인스턴스 15.18달러, gp3 60GB 디스크 5.47달러, 공인 IPv4 3.65달러로 약 24.31달러, t3.small 구성은 인스턴스 18.98달러에 같은 디스크와 IP를 더해 약 28.10달러입니다.</desc>

  <rect width="1200" height="640" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="638" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="88" font-size="36" font-weight="700" fill="#1e293b">메모리 2GB 서버, 한 달 요금은 어디서 갈리나</text>
    <text x="64" y="132" font-size="24" fill="#475569">서울 리전, 리눅스, 730시간 기준 (미국 달러, 세금 별도, 트래픽 제외)</text>

    <!-- 눈금선: x = 300 + 25 × 달러 -->
    <g stroke="#e2e8f0" stroke-width="2">
      <path d="M550 176 V488" />
      <path d="M800 176 V488" />
      <path d="M1050 176 V488" />
    </g>
    <path d="M300 176 V488" stroke="#94a3b8" stroke-width="2" />

    <!-- 행 이름 -->
    <g font-size="24" font-weight="700" fill="#1e293b">
      <text x="64" y="226">Lightsail</text>
      <text x="64" y="338">EC2</text>
      <text x="64" y="450">EC2</text>
    </g>
    <g font-size="22" fill="#475569">
      <text x="64" y="256">2GB 플랜</text>
      <text x="64" y="368">t4g.small (Arm)</text>
      <text x="64" y="480">t3.small (Intel)</text>
    </g>

    <!-- Lightsail: 12달러 = 300px -->
    <rect x="300" y="200" width="300" height="64" rx="6" fill="#0f766e" />
    <text x="450" y="241" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">$12 묶음</text>
    <text x="616" y="241" font-size="24" font-weight="700" fill="#1e293b">$12.00</text>

    <!-- t4g.small: 15.18 / 5.47 / 3.65 -->
    <rect x="300" y="312" width="379.5" height="64" fill="#1d4ed8" />
    <rect x="679.5" y="312" width="136.75" height="64" fill="#7c3aed" />
    <rect x="816.25" y="312" width="91.25" height="64" fill="#be185d" />
    <g font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">
      <text x="489.75" y="353">$15.18</text>
      <text x="747.9" y="353">$5.47</text>
      <text x="861.9" y="353">$3.65</text>
    </g>
    <text x="924" y="353" font-size="24" font-weight="700" fill="#1e293b">약 $24.31</text>

    <!-- t3.small: 18.98 / 5.47 / 3.65 -->
    <rect x="300" y="424" width="474.5" height="64" fill="#1d4ed8" />
    <rect x="774.5" y="424" width="136.75" height="64" fill="#7c3aed" />
    <rect x="911.25" y="424" width="91.25" height="64" fill="#be185d" />
    <g font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">
      <text x="537.25" y="465">$18.98</text>
      <text x="842.9" y="465">$5.47</text>
      <text x="956.9" y="465">$3.65</text>
    </g>
    <text x="1018" y="465" font-size="24" font-weight="700" fill="#1e293b">$28.10</text>

    <!-- 눈금 글자 -->
    <g font-size="22" fill="#475569" text-anchor="middle">
      <text x="300" y="520">$0</text>
      <text x="550" y="520">$10</text>
      <text x="800" y="520">$20</text>
      <text x="1050" y="520">$30</text>
    </g>

    <!-- 범례 -->
    <g font-size="22" fill="#334155">
      <rect x="64" y="560" width="24" height="24" rx="4" fill="#0f766e" />
      <text x="98" y="580">묶음 (서버·SSD·IP·전송량)</text>
      <rect x="440" y="560" width="24" height="24" rx="4" fill="#1d4ed8" />
      <text x="474" y="580">인스턴스</text>
      <rect x="600" y="560" width="24" height="24" rx="4" fill="#7c3aed" />
      <text x="634" y="580">gp3 디스크 60GB</text>
      <rect x="840" y="560" width="24" height="24" rx="4" fill="#be185d" />
      <text x="874" y="580">공인 IPv4</text>
    </g>
  </g>
</svg>
