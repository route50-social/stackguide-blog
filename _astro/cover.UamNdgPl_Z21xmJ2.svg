<!-- 표지: 해 질 녘 창밖에 구름이 떠 있고, 방 안 책상 위의 데스크톱 PC가 스탠드 불빛 아래에서 조용히 돌아가는 장면. 클라우드 AI와 내 컴퓨터에서 돌리는 AI를 상징합니다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">창밖의 구름과 책상 위의 데스크톱 PC</title>
  <desc id="cover-desc">해 질 녘 큰 창밖으로 분홍빛 하늘에 구름이 떠 있고, 방 안 나무 책상 위에서는 옆면이 투명한 데스크톱 PC가 따뜻한 스탠드 불빛을 받으며 그래픽카드 팬을 돌리고 있습니다.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3355" />
      <stop offset="0.55" stop-color="#4a3f63" />
      <stop offset="1" stop-color="#2c2742" />
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5b9a" />
      <stop offset="0.5" stop-color="#b27aa6" />
      <stop offset="0.85" stop-color="#f2a97e" />
      <stop offset="1" stop-color="#f8c99a" />
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4ec" />
      <stop offset="1" stop-color="#e8b7b8" />
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7714a" />
      <stop offset="1" stop-color="#7a4e31" />
    </linearGradient>
    <linearGradient id="deskEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e3a23" />
      <stop offset="1" stop-color="#3f2717" />
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2230" />
      <stop offset="1" stop-color="#2d3142" />
    </linearGradient>
    <linearGradient id="caseGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3150" stop-opacity="0.95" />
      <stop offset="1" stop-color="#151a2c" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4056" />
      <stop offset="1" stop-color="#262a3a" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0.75" />
      <stop offset="0.5" stop-color="#ffc061" stop-opacity="0.25" />
      <stop offset="1" stop-color="#ffc061" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="caseGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.55" />
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lightCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffd48a" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#120d1c" flood-opacity="0.45" />
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <clipPath id="windowClip">
      <rect x="196" y="120" width="620" height="470" rx="6" />
    </clipPath>
    <g id="fan">
      <circle r="46" fill="#1b1f2c" stroke="#4b5268" stroke-width="3" />
      <path d="M0 -40 C18 -30 18 -10 0 0 C-6 -14 -10 -28 0 -40 Z" fill="#59617a" />
      <path d="M0 -40 C18 -30 18 -10 0 0 C-6 -14 -10 -28 0 -40 Z" fill="#59617a" transform="rotate(72)" />
      <path d="M0 -40 C18 -30 18 -10 0 0 C-6 -14 -10 -28 0 -40 Z" fill="#59617a" transform="rotate(144)" />
      <path d="M0 -40 C18 -30 18 -10 0 0 C-6 -14 -10 -28 0 -40 Z" fill="#59617a" transform="rotate(216)" />
      <path d="M0 -40 C18 -30 18 -10 0 0 C-6 -14 -10 -28 0 -40 Z" fill="#59617a" transform="rotate(288)" />
      <circle r="10" fill="#7dd3fc" />
    </g>
  </defs>

  <!-- 벽 -->
  <rect width="1600" height="900" fill="url(#wall)" />

  <!-- 창문과 바깥 하늘 -->
  <rect x="176" y="100" width="660" height="510" rx="12" fill="#272238" filter="url(#shadow)" />
  <g clip-path="url(#windowClip)">
    <rect x="196" y="120" width="620" height="470" fill="url(#sky)" />
    <circle cx="640" cy="540" r="70" fill="#ffe2b3" opacity="0.8" />
    <g fill="url(#cloud)">
      <g opacity="0.95">
        <ellipse cx="330" cy="250" rx="110" ry="40" />
        <ellipse cx="290" cy="228" rx="58" ry="42" />
        <ellipse cx="370" cy="214" rx="68" ry="52" />
      </g>
      <g opacity="0.9">
        <ellipse cx="640" cy="330" rx="130" ry="44" />
        <ellipse cx="590" cy="306" rx="62" ry="44" />
        <ellipse cx="676" cy="290" rx="78" ry="58" />
      </g>
      <g opacity="0.8">
        <ellipse cx="400" cy="450" rx="120" ry="34" />
        <ellipse cx="440" cy="428" rx="64" ry="40" />
      </g>
    </g>
    <!-- 먼 건물 실루엣 -->
    <path d="M196 590 V520 H250 V500 H300 V540 H350 V480 H400 V530 H470 V510 H520 V560 H600 V530 H660 V505 H720 V545 H816 V590 Z" fill="#3a3152" opacity="0.85" />
  </g>
  <!-- 창틀 -->
  <g fill="#272238">
    <rect x="496" y="120" width="20" height="470" />
    <rect x="196" y="345" width="620" height="16" />
  </g>
  <rect x="160" y="600" width="692" height="22" rx="6" fill="#5b4d72" />

  <!-- 스탠드 불빛 -->
  <circle cx="1270" cy="300" r="420" fill="url(#lampGlow)" />
  <path d="M1196 360 L1000 700 H1380 L1246 440 Z" fill="url(#lightCone)" />

  <!-- 책상 -->
  <rect x="0" y="690" width="1600" height="70" fill="url(#desk)" />
  <rect x="0" y="760" width="1600" height="140" fill="url(#deskEdge)" />
  <rect x="0" y="690" width="1600" height="6" fill="#c08a60" opacity="0.6" />

  <!-- 스탠드 -->
  <g filter="url(#shadow)">
    <ellipse cx="1420" cy="692" rx="80" ry="16" fill="#2d2a35" />
    <path d="M1420 690 L1400 470 L1290 330" fill="none" stroke="#3b3746" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M1196 360 L1290 300 L1340 380 L1246 440 Z" fill="#e7a43b" />
    <path d="M1206 366 L1246 440" stroke="#b9791f" stroke-width="6" />
  </g>
  <ellipse cx="1221" cy="400" rx="48" ry="12" fill="#fff2cf" filter="url(#soft)" transform="rotate(58 1221 400)" />

  <!-- 데스크톱 PC 본체 -->
  <ellipse cx="1000" cy="560" rx="260" ry="260" fill="url(#caseGlow)" />
  <g filter="url(#shadow)">
    <rect x="860" y="330" width="290" height="366" rx="18" fill="url(#case)" />
    <rect x="884" y="356" width="214" height="314" rx="10" fill="url(#caseGlass)" stroke="#4b5268" stroke-width="2" />
    <rect x="1110" y="356" width="24" height="314" rx="6" fill="#171a26" />
    <g fill="#7dd3fc" opacity="0.8">
      <rect x="1116" y="376" width="12" height="4" rx="2" />
      <rect x="1116" y="392" width="12" height="4" rx="2" />
      <rect x="1116" y="408" width="12" height="4" rx="2" />
    </g>
    <circle cx="1122" cy="644" r="7" fill="#ffd48a" />
    <!-- 메인보드와 메모리 -->
    <rect x="904" y="376" width="174" height="140" rx="6" fill="#1f2a3d" />
    <rect x="1000" y="392" width="10" height="96" rx="2" fill="#94a3b8" />
    <rect x="1018" y="392" width="10" height="96" rx="2" fill="#94a3b8" />
    <rect x="924" y="400" width="56" height="56" rx="6" fill="#2b3a52" stroke="#4b5268" stroke-width="2" />
    <!-- 그래픽카드 -->
    <rect x="898" y="530" width="190" height="96" rx="10" fill="url(#gpu)" stroke="#4b5268" stroke-width="2" />
    <use href="#fan" x="946" y="578" />
    <use href="#fan" x="1040" y="578" />
    <rect x="898" y="530" width="190" height="6" rx="3" fill="#7dd3fc" opacity="0.85" />
    <!-- 받침 -->
    <rect x="876" y="694" width="36" height="8" rx="3" fill="#11131b" />
    <rect x="1098" y="694" width="36" height="8" rx="3" fill="#11131b" />
  </g>

  <!-- 머그잔과 공책 -->
  <g filter="url(#shadow)">
    <path d="M640 600 H720 V676 Q720 694 702 694 H658 Q640 694 640 676 Z" fill="#e6dccd" />
    <path d="M720 620 Q752 624 748 650 Q744 672 720 668" fill="none" stroke="#e6dccd" stroke-width="10" />
    <ellipse cx="680" cy="602" rx="40" ry="8" fill="#6b4a32" />
    <rect x="420" y="664" width="200" height="30" rx="4" fill="#5d7a8c" transform="rotate(-3 520 680)" />
    <rect x="428" y="660" width="190" height="8" rx="2" fill="#f1ece3" transform="rotate(-3 520 680)" />
  </g>
  <path d="M668 586 C660 566 680 556 672 536" fill="none" stroke="#f5efe6" stroke-width="4" stroke-linecap="round" opacity="0.45" />
  <path d="M690 586 C682 566 702 556 694 536" fill="none" stroke="#f5efe6" stroke-width="4" stroke-linecap="round" opacity="0.35" />
</svg>
