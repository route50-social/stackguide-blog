    <g font-size="22" fill="#475569">
      <text x="88" y="324">Ubuntu 24.04 · $12 플랜</text>
      <text x="456" y="324">재시작해도 주소 유지</text>
      <text x="824" y="324">443 추가 · SSH 좁히기</text>
      <text x="88" y="540">Node.js · Nginx · PostgreSQL</text>
      <text x="456" y="540">appdb · appuser</text>
      <text x="824" y="540" font-family="'JetBrains Mono', Menlo, Consolas, monospace">npm ci → build</text>
      <text x="88" y="692">3000번 상시 실행</text>
      <text x="456" y="692">80번 → 3000번 전달</text>
      <text x="824" y="692">A 레코드 · Certbot</text>
    </g>

