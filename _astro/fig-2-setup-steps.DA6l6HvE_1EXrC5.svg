<!-- 그림 2: Lightsail 콘솔 3단계와 서버 터미널 6단계로 나눈 배포 작업 순서 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">Lightsail에 Next.js·PostgreSQL을 배포하는 작업 순서</title>
  <desc id="fig2-desc">Lightsail 콘솔에서 1 인스턴스 만들기, 2 고정 IP 붙이기, 3 방화벽 설정을 하고, SSH로 서버에 접속해 4 프로그램 설치, 5 데이터베이스와 사용자 만들기, 6 코드 받기와 빌드, 7 systemd 등록, 8 Nginx 연결, 9 도메인 연결과 HTTPS 인증서 발급을 차례로 진행합니다.</desc>
  <defs>
    <marker id="f2-arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M5 2 L12 7 L5 12" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    </marker>
  </defs>

  <rect width="1200" height="760" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="758" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="88" font-size="36" font-weight="700" fill="#1e293b">배포 작업 순서</text>
    <text x="64" y="132" font-size="24" fill="#475569">콘솔에서 서버와 네트워크를 준비한 뒤, 서버에 접속해 프로그램을 설치합니다</text>

    <!-- 구역 이름 -->
    <rect x="64" y="168" width="232" height="40" rx="20" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <text x="180" y="196" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">Lightsail 콘솔</text>
    <rect x="64" y="384" width="296" height="40" rx="20" fill="#dbeafe" stroke="#475569" stroke-width="2" />
    <text x="212" y="412" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">서버 터미널 (SSH 접속 후)</text>

    <!-- 단계 상자: 336×120, 간격 32 -->
    <g stroke="#94a3b8" stroke-width="2">
      <rect x="64" y="224" width="336" height="120" rx="16" fill="#fffbeb" />
      <rect x="432" y="224" width="336" height="120" rx="16" fill="#fffbeb" />
      <rect x="800" y="224" width="336" height="120" rx="16" fill="#fffbeb" />
      <rect x="64" y="440" width="336" height="120" rx="16" fill="#eff6ff" />
