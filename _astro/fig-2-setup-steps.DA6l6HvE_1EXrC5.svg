      <rect x="432" y="592" width="336" height="120" rx="16" fill="#eff6ff" />
      <rect x="800" y="592" width="336" height="120" rx="16" fill="#dcfce7" />
    </g>
    <g fill="#ffffff" stroke="#64748b" stroke-width="2">
      <circle cx="108" cy="268" r="22" />
      <circle cx="476" cy="268" r="22" />
      <circle cx="844" cy="268" r="22" />
