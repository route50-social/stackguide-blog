<!-- 표지: 작업대 위에 한 줄로 놓인 나무 활자 블록과, 줄 끝 빈자리 위에 떠 있는 다음 블록 후보 세 개. 앞 조각을 보고 다음 조각을 확률로 고르는 LLM을 상징 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">한 줄로 놓인 활자 블록과 다음 블록 후보</title>
  <desc id="cover-desc">짙은 청록색 작업대 위에 한글이 새겨진 나무 활자 블록 다섯 개가 한 줄로 놓여 있고, 줄 끝의 빈자리 위로 후보 블록 세 개가 떠 있습니다. 가장 밝게 빛나는 블록이 빈자리 바로 위에 있고, 나머지 두 블록은 점점 흐릿합니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a2e" />
      <stop offset="0.55" stop-color="#123d41" />
      <stop offset="1" stop-color="#0a2225" />
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4b4f" />
      <stop offset="1" stop-color="#0c2a2d" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55" />
      <stop offset="0.55" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c99a" />
      <stop offset="1" stop-color="#c99a62" />
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e2c2" />
      <stop offset="1" stop-color="#ead1a8" />
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a87843" />
      <stop offset="1" stop-color="#8a5f31" />
    </linearGradient>
    <linearGradient id="frontLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="1" stop-color="#f2b84b" />
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="8" dy="18" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>

    <!-- 블록 하나: 앞면 150×150, 윗면·옆면 깊이 36 (앞면 왼쪽 위가 원점) -->
    <g id="block">
      <path d="M0 0 L36 -36 L186 -36 L150 0 Z" fill="url(#top)" />
      <path d="M150 0 L186 -36 L186 114 L150 150 Z" fill="url(#side)" />
      <rect x="0" y="0" width="150" height="150" rx="6" fill="url(#front)" />
      <rect x="10" y="10" width="130" height="130" rx="4" fill="none" stroke="#a87843" stroke-opacity="0.45" stroke-width="2" />
    </g>
    <g id="blockLit">
      <path d="M0 0 L36 -36 L186 -36 L150 0 Z" fill="#fff3c4" />
      <path d="M150 0 L186 -36 L186 114 L150 150 Z" fill="#d99a2b" />
      <rect x="0" y="0" width="150" height="150" rx="6" fill="url(#frontLit)" />
      <rect x="10" y="10" width="130" height="130" rx="4" fill="none" stroke="#b45309" stroke-opacity="0.5" stroke-width="2" />
    </g>
  </defs>

  <!-- 배경과 작업대 -->
  <rect width="1600" height="900" fill="url(#bg)" />
  <path d="M0 600 L1600 600 L1600 900 L0 900 Z" fill="url(#bench)" />
  <path d="M0 600 L1600 600" stroke="#2f6a6e" stroke-width="3" />
  <g stroke="#2a5c60" stroke-opacity="0.35" stroke-width="2">
    <path d="M0 680 H1600" />
    <path d="M0 780 H1600" />
  </g>

  <!-- 블록 전체를 가운데로 모으기 위해 작업대 높이(y=600)를 기준으로 축소 -->
  <g transform="translate(780 600) scale(0.82) translate(-780 -600)">
  <!-- 빈자리 위의 빛 -->
  <ellipse cx="1240" cy="380" rx="300" ry="300" fill="url(#glow)" />

  <!-- 한 줄로 놓인 블록들 -->
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" font-size="92" font-weight="700" fill="#5b3a17" text-anchor="middle">
    <g transform="translate(150 470)" filter="url(#shadow)"><use href="#block" /><text x="75" y="108">커</text></g>
    <g transform="translate(330 470)" filter="url(#shadow)"><use href="#block" /><text x="75" y="108">피</text></g>
    <g transform="translate(510 470)" filter="url(#shadow)"><use href="#block" /><text x="75" y="108">를</text></g>
    <g transform="translate(690 470)" filter="url(#shadow)"><use href="#block" /><text x="75" y="108">한</text></g>
    <g transform="translate(870 470)" filter="url(#shadow)"><use href="#block" /><text x="75" y="108">잔</text></g>
  </g>

  <!-- 줄 끝 빈자리 -->
  <rect x="1050" y="470" width="150" height="150" rx="6" fill="none" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="4" stroke-dasharray="16 12" />
  <path d="M1050 470 L1086 434 L1236 434 L1200 470" fill="none" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="12 10" />

  <!-- 떠 있는 후보 블록 세 개 -->
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" font-size="92" font-weight="700" text-anchor="middle">
    <g transform="translate(1230 90)" opacity="0.32" filter="url(#shadow)"><use href="#block" /><text x="75" y="108" fill="#5b3a17">하</text></g>
    <g transform="translate(1290 300)" opacity="0.5" filter="url(#shadow)"><use href="#block" /><text x="75" y="108" fill="#5b3a17">드</text></g>
    <ellipse cx="1125" cy="290" rx="120" ry="110" fill="#fbbf24" opacity="0.35" filter="url(#blurGlow)" />
    <g transform="translate(1050 215)" filter="url(#shadow)"><use href="#blockLit" /><text x="75" y="108" fill="#78350f">마</text></g>
  </g>

  <!-- 빈자리로 내려갈 자리 표시 -->
  <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M1125 392 V446" stroke-dasharray="4 12" />
  </g>
  </g>
</svg>
