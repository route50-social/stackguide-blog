<!-- 그림 1: 사전학습 → 지도 파인튜닝(SFT) → 선호 학습(RLHF·DPO)으로 이어지는 LLM 학습 3단계의 데이터·목표·결과 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">LLM이 만들어지는 세 단계</title>
  <desc id="fig1-desc">1 사전학습은 웹 문서, 책, 코드 등 수조 개의 토큰으로 다음 토큰 맞히기를 배워 베이스 모델이 됩니다. 2 지도 파인튜닝은 질문과 모범 답안 쌍으로 답안을 따라 쓰게 해 지시를 따르는 모델을 만듭니다. 3 선호 학습은 같은 질문에 대한 여러 답변의 비교와 순위로 더 나은 답 쪽으로 모델을 기울여 대화형 어시스턴트를 만듭니다. 오른쪽으로 갈수록 데이터 양은 줄고 학습용으로 따로 만든 데이터가 많아집니다.</desc>
  <defs>
    <marker id="f1-arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M4 2 L12 7 L4 12" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    </marker>
  </defs>

  <rect width="1200" height="680" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="678" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="88" font-size="36" font-weight="700" fill="#0f172a">LLM이 만들어지는 세 단계</text>
    <text x="64" y="128" font-size="24" fill="#475569">앞 단계에서 만든 모델을 다음 단계가 이어받아 다듬습니다</text>

    <!-- 단계 상자: 320×400, 간격 56 -->
    <rect x="64" y="168" width="320" height="400" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2" />
    <rect x="440" y="168" width="320" height="400" rx="16" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2" />
    <rect x="816" y="168" width="320" height="400" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2" />

    <!-- 단계 사이 화살표 -->
    <line x1="392" y1="368" x2="430" y2="368" stroke="#334155" stroke-width="3" marker-end="url(#f1-arrow)" />
    <line x1="768" y1="368" x2="806" y2="368" stroke="#334155" stroke-width="3" marker-end="url(#f1-arrow)" />

    <!-- 번호 -->
    <g fill="#ffffff" stroke="#475569" stroke-width="2">
      <circle cx="112" cy="216" r="24" />
      <circle cx="488" cy="216" r="24" />
      <circle cx="864" cy="216" r="24" />
    </g>
    <g font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">
      <text x="112" y="225">1</text>
      <text x="488" y="225">2</text>
      <text x="864" y="225">3</text>
    </g>

    <!-- 단계 이름 -->
    <g font-size="30" font-weight="700" fill="#0f172a">
      <text x="152" y="226">사전학습</text>
      <text x="528" y="226">지도 파인튜닝</text>
      <text x="904" y="226">선호 학습</text>
    </g>
    <g font-size="22" fill="#475569">
      <text x="152" y="258">Pre-training</text>
      <text x="528" y="258">SFT</text>
      <text x="904" y="258">RLHF · DPO</text>
    </g>

    <!-- 항목 이름 -->
    <g font-size="22" font-weight="700" fill="#334155">
      <text x="88" y="312">데이터</text>
      <text x="464" y="312">데이터</text>
      <text x="840" y="312">데이터</text>
      <text x="88" y="408">학습 목표</text>
      <text x="464" y="408">학습 목표</text>
      <text x="840" y="408">학습 목표</text>
    </g>
    <g font-size="22" fill="#1e293b">
      <text x="88" y="344">웹 문서·책·코드</text>
      <text x="88" y="374">수조 개의 토큰</text>
      <text x="464" y="344">질문과 모범 답안 쌍</text>
      <text x="464" y="374">수천~수백만 개</text>
      <text x="840" y="344">한 질문에 대한 여러</text>
      <text x="840" y="374">답변의 비교·순위</text>
      <text x="88" y="440">다음 토큰 맞히기</text>
      <text x="464" y="440">모범 답안 따라 쓰기</text>
      <text x="840" y="440">더 나은 답 쪽으로</text>
      <text x="840" y="470">기울이기</text>
    </g>

    <!-- 결과 -->
    <g stroke-width="2">
      <rect x="88" y="496" width="272" height="48" rx="24" fill="#ffffff" stroke="#8b5cf6" />
      <rect x="464" y="496" width="272" height="48" rx="24" fill="#ffffff" stroke="#0ea5e9" />
      <rect x="840" y="496" width="272" height="48" rx="24" fill="#ffffff" stroke="#16a34a" />
    </g>
    <g font-size="22" font-weight="700" text-anchor="middle">
      <text x="224" y="528" fill="#5b21b6">베이스 모델</text>
      <text x="600" y="528" fill="#0369a1">지시를 따르는 모델</text>
      <text x="976" y="528" fill="#15803d">대화형 어시스턴트</text>
    </g>

    <!-- 아래 흐름 설명 -->
    <line x1="64" y1="616" x2="1126" y2="616" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1-arrow)" />
    <text x="64" y="652" font-size="22" fill="#475569">오른쪽으로 갈수록 데이터 양은 줄고, 학습용으로 따로 만든 데이터가 많아집니다</text>
  </g>
</svg>
