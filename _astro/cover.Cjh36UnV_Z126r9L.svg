<!-- 표지: 작업 매트 위에 놓인 그래픽카드, 메모리 두 장, CPU와 그래픽카드 메모리 칩을 비추는 돋보기. 내 컴퓨터의 부품을 점검하는 장면을 상징합니다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">작업 매트 위에서 점검하는 컴퓨터 부품</title>
  <desc id="cover-desc">격자가 그려진 짙은 초록색 작업 매트 위에 팬 두 개가 달린 그래픽카드, 메모리 모듈 두 장, CPU 칩이 놓여 있고, 둥근 돋보기가 그래픽카드의 메모리 칩을 확대해 비추고 있습니다. 위쪽에서 따뜻한 조명이 비칩니다.</desc>
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4f4a" />
      <stop offset="0.55" stop-color="#173f3b" />
      <stop offset="1" stop-color="#0f2e2b" />
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#fff1c9" stop-opacity="0.32" />
      <stop offset="0.55" stop-color="#ffe7a8" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffe7a8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#5fa39a" stroke-opacity="0.22" stroke-width="2" />
    </pattern>
    <linearGradient id="cardBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4250" />
      <stop offset="1" stop-color="#232933" />
    </linearGradient>
    <linearGradient id="shroud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5565" />
      <stop offset="1" stop-color="#2b323d" />
    </linearGradient>
    <radialGradient id="fan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b2028" />
      <stop offset="0.7" stop-color="#262d38" />
      <stop offset="1" stop-color="#11151b" />
    </radialGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7d55" />
      <stop offset="1" stop-color="#1f5e3e" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf6b" />
      <stop offset="1" stop-color="#c8952c" />
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f37" />
      <stop offset="1" stop-color="#14171c" />
    </linearGradient>
    <linearGradient id="ihs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4e8ee" />
      <stop offset="0.5" stop-color="#b9c1cc" />
      <stop offset="1" stop-color="#8f98a5" />
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="0.6" stop-color="#d8f3ee" stop-opacity="0.12" />
      <stop offset="1" stop-color="#9fd8cf" stop-opacity="0.18" />
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e09a3a" />
      <stop offset="0.5" stop-color="#f3b955" />
      <stop offset="1" stop-color="#b8731f" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <clipPath id="lensClip">
      <circle cx="1040" cy="300" r="118" />
    </clipPath>
  </defs>

  <!-- 배경: 작업 매트와 조명 -->
  <rect width="1600" height="900" fill="url(#mat)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <rect width="1600" height="900" fill="url(#lamp)" />
  <g fill="#5fa39a" fill-opacity="0.35" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22">
    <path d="M64 840 H1536" stroke="#5fa39a" stroke-opacity="0.45" stroke-width="2" />
    <path d="M64 840 V820 M192 840 V828 M320 840 V820 M448 840 V828 M576 840 V820 M704 840 V828 M832 840 V820 M960 840 V828 M1088 840 V820 M1216 840 V828 M1344 840 V820 M1472 840 V828" stroke="#5fa39a" stroke-opacity="0.45" stroke-width="2" />
  </g>

  <!-- 메모리 모듈 두 장 (왼쪽 아래) -->
  <g filter="url(#softShadow)" transform="rotate(-8 330 640)">
    <rect x="120" y="560" width="440" height="104" rx="6" fill="url(#pcb)" />
    <g fill="url(#chip)">
      <rect x="144" y="576" width="72" height="56" rx="3" />
      <rect x="232" y="576" width="72" height="56" rx="3" />
      <rect x="320" y="576" width="72" height="56" rx="3" />
      <rect x="408" y="576" width="72" height="56" rx="3" />
      <rect x="496" y="576" width="48" height="56" rx="3" />
    </g>
    <g fill="url(#gold)">
      <rect x="132" y="648" width="416" height="16" rx="2" />
    </g>
    <g stroke="#1f5e3e" stroke-width="3">
      <path d="M150 648 V664 M170 648 V664 M190 648 V664 M210 648 V664 M230 648 V664 M250 648 V664 M270 648 V664 M290 648 V664 M310 648 V664 M330 648 V664 M370 648 V664 M390 648 V664 M410 648 V664 M430 648 V664 M450 648 V664 M470 648 V664 M490 648 V664 M510 648 V664 M530 648 V664" />
    </g>
    <rect x="344" y="644" width="10" height="22" fill="#1f4f4a" />
  </g>
  <g filter="url(#softShadow)" transform="rotate(-4 360 740)">
    <rect x="160" y="680" width="440" height="104" rx="6" fill="url(#pcb)" />
    <g fill="url(#chip)">
      <rect x="184" y="696" width="72" height="56" rx="3" />
      <rect x="272" y="696" width="72" height="56" rx="3" />
      <rect x="360" y="696" width="72" height="56" rx="3" />
      <rect x="448" y="696" width="72" height="56" rx="3" />
      <rect x="536" y="696" width="48" height="56" rx="3" />
    </g>
    <rect x="172" y="768" width="416" height="16" rx="2" fill="url(#gold)" />
    <g stroke="#1f5e3e" stroke-width="3">
      <path d="M190 768 V784 M210 768 V784 M230 768 V784 M250 768 V784 M270 768 V784 M290 768 V784 M310 768 V784 M330 768 V784 M350 768 V784 M370 768 V784 M410 768 V784 M430 768 V784 M450 768 V784 M470 768 V784 M490 768 V784 M510 768 V784 M530 768 V784 M550 768 V784 M570 768 V784" />
    </g>
    <rect x="384" y="764" width="10" height="22" fill="#1f4f4a" />
  </g>

  <!-- CPU (오른쪽 아래) -->
  <g filter="url(#softShadow)" transform="rotate(10 1300 680)">
    <rect x="1180" y="560" width="240" height="240" rx="14" fill="#2f7d55" />
    <rect x="1180" y="560" width="240" height="240" rx="14" fill="none" stroke="#c8952c" stroke-width="3" stroke-dasharray="4 6" />
    <rect x="1212" y="592" width="176" height="176" rx="12" fill="url(#ihs)" />
    <rect x="1236" y="616" width="128" height="128" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" />
  </g>

  <!-- 그래픽카드 (가운데) -->
  <g filter="url(#shadow)">
    <rect x="360" y="176" width="880" height="320" rx="20" fill="url(#cardBody)" />
    <!-- 기판 가장자리와 PCIe 단자 -->
    <rect x="420" y="480" width="560" height="40" rx="4" fill="url(#pcb)" />
    <rect x="452" y="496" width="232" height="24" rx="2" fill="url(#gold)" />
    <rect x="704" y="496" width="256" height="24" rx="2" fill="url(#gold)" />
    <!-- 브래킷 -->
    <rect x="1236" y="160" width="40" height="380" rx="6" fill="#aab3bf" />
    <g fill="#6b7480">
      <rect x="1248" y="200" width="16" height="56" rx="4" />
      <rect x="1248" y="280" width="16" height="56" rx="4" />
      <rect x="1248" y="360" width="16" height="56" rx="4" />
    </g>
    <!-- 덮개와 팬 -->
    <rect x="384" y="196" width="832" height="280" rx="18" fill="url(#shroud)" />
    <path d="M384 260 L460 196 M1140 476 L1216 412" stroke="#f3b955" stroke-width="6" stroke-linecap="round" />
    <g>
      <circle cx="580" cy="336" r="116" fill="#161a20" />
      <circle cx="580" cy="336" r="104" fill="url(#fan)" />
      <g fill="#3a4351">
        <path d="M580 336 C600 280 640 254 668 270 C640 290 616 316 580 336 Z" />
        <path d="M580 336 C636 352 664 392 650 420 C628 394 604 370 580 336 Z" />
        <path d="M580 336 C566 392 528 420 500 408 C526 386 552 362 580 336 Z" />
        <path d="M580 336 C524 322 494 284 506 254 C530 280 554 304 580 336 Z" />
        <path d="M580 336 C590 300 612 270 640 262 Z" fill-opacity="0.5" />
      </g>
      <circle cx="580" cy="336" r="30" fill="#2b323d" stroke="#4b5565" stroke-width="4" />
    </g>
    <g>
      <circle cx="884" cy="336" r="116" fill="#161a20" />
      <circle cx="884" cy="336" r="104" fill="url(#fan)" />
      <g fill="#3a4351">
        <path d="M884 336 C904 280 944 254 972 270 C944 290 920 316 884 336 Z" />
        <path d="M884 336 C940 352 968 392 954 420 C932 394 908 370 884 336 Z" />
        <path d="M884 336 C870 392 832 420 804 408 C830 386 856 362 884 336 Z" />
        <path d="M884 336 C828 322 798 284 810 254 C834 280 858 304 884 336 Z" />
      </g>
      <circle cx="884" cy="336" r="30" fill="#2b323d" stroke="#4b5565" stroke-width="4" />
    </g>
  </g>

  <!-- 돋보기: 렌즈 안에는 덮개 아래의 메모리 칩이 확대되어 보입니다 -->
  <g filter="url(#shadow)">
    <path d="M1124 388 L1268 532" stroke="#3b2a14" stroke-width="44" stroke-linecap="round" stroke-opacity="0.35" />
    <path d="M1120 380 L1260 520" stroke="url(#handle)" stroke-width="36" stroke-linecap="round" />
    <g clip-path="url(#lensClip)">
      <rect x="900" y="160" width="280" height="280" fill="#1f5e3e" />
      <g stroke="#3f9a6c" stroke-width="3" fill="none">
        <path d="M900 214 H1180 M900 386 H1180 M954 160 V440 M1126 160 V440" />
      </g>
      <g fill="url(#chip)">
        <rect x="944" y="228" width="88" height="64" rx="4" />
        <rect x="1048" y="228" width="88" height="64" rx="4" />
        <rect x="944" y="308" width="88" height="64" rx="4" />
        <rect x="1048" y="308" width="88" height="64" rx="4" />
      </g>
      <g fill="#f3b955" fill-opacity="0.9">
        <circle cx="956" cy="240" r="5" />
        <circle cx="1060" cy="240" r="5" />
        <circle cx="956" cy="320" r="5" />
        <circle cx="1060" cy="320" r="5" />
      </g>
      <circle cx="1040" cy="300" r="118" fill="url(#lens)" />
      <path d="M970 240 A90 90 0 0 1 1040 206" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="8" stroke-linecap="round" />
    </g>
    <circle cx="1040" cy="300" r="118" fill="none" stroke="#2b323d" stroke-width="22" />
    <circle cx="1040" cy="300" r="118" fill="none" stroke="#9aa4b1" stroke-width="10" />
  </g>
</svg>
