<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="cover-title cover-desc">
  <!-- 표지: 처음 띄운 서비스(종이배)를 무료로 올릴 수 있지만 조건과 시간이 붙는다는 뜻. 선착장 기둥의 0 가격표와 모래시계 -->
  <title id="cover-title">호수 위 종이배와 0 가격표가 걸린 선착장</title>
  <desc id="cover-desc">이른 아침 안개 낀 산을 배경으로 잔잔한 호수 위에 흰 종이배 한 척이 떠 있고, 오른쪽 작은 나무 선착장 기둥에 0이 적힌 주황색 가격표와 모래시계가 걸려 있습니다.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc9d6" />
      <stop offset="0.6" stop-color="#d8ebe8" />
      <stop offset="1" stop-color="#f6efe0" />
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e0" stop-opacity="1" />
      <stop offset="0.4" stop-color="#ffe9b8" stop-opacity="0.6" />
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3bf" />
      <stop offset="0.5" stop-color="#4f8c9c" />
      <stop offset="1" stop-color="#2d5f6e" />
    </linearGradient>
    <linearGradient id="mountFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb3b8" />
      <stop offset="1" stop-color="#b9d2d0" />
    </linearGradient>
    <linearGradient id="mountNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8f8c" />
      <stop offset="1" stop-color="#7ea6a0" />
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4a33" />
      <stop offset="0.5" stop-color="#8a6243" />
      <stop offset="1" stop-color="#5a3e2b" />
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a47b56" />
      <stop offset="1" stop-color="#7b5638" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dfe6ea" />
    </linearGradient>
    <linearGradient id="paperShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3ced4" />
      <stop offset="1" stop-color="#e8eef1" />
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6a04d" />
      <stop offset="1" stop-color="#e07b24" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f3f5" stop-opacity="0.9" />
      <stop offset="1" stop-color="#bcd6dc" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="4" dy="8" result="b" />
      <feComponentTransfer><feFuncA type="linear" slope="0.35" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="haze" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- 하늘과 해 -->
  <rect width="1600" height="900" fill="url(#sky)" />
  <circle cx="1120" cy="250" r="220" fill="url(#sun)" />
  <circle cx="1120" cy="250" r="64" fill="#fffaf0" opacity="0.9" />

  <!-- 먼 산과 가까운 산 -->
  <path d="M0 470 L180 360 L330 430 L520 300 L700 420 L860 340 L1040 440 L1240 320 L1420 410 L1600 350 L1600 520 L0 520 Z" fill="url(#mountFar)" />
  <path d="M0 520 L140 440 L300 500 L460 420 L640 510 L820 450 L1000 520 L1180 460 L1380 515 L1600 450 L1600 540 L0 540 Z" fill="url(#mountNear)" />
  <!-- 물안개 -->
  <ellipse cx="500" cy="530" rx="520" ry="26" fill="#eef6f4" opacity="0.7" filter="url(#haze)" />
  <ellipse cx="1200" cy="535" rx="460" ry="22" fill="#eef6f4" opacity="0.6" filter="url(#haze)" />

  <!-- 호수 -->
  <rect y="530" width="1600" height="370" fill="url(#water)" />
  <!-- 해 반사 -->
  <g fill="#fff4d6" opacity="0.55">
    <rect x="1080" y="560" width="80" height="4" rx="2" />
    <rect x="1060" y="590" width="120" height="4" rx="2" />
    <rect x="1090" y="622" width="60" height="4" rx="2" />
    <rect x="1050" y="656" width="140" height="4" rx="2" />
  </g>
  <!-- 잔물결 -->
  <g stroke="#cfe5e8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M120 620 q30 -8 60 0 t60 0" />
    <path d="M300 700 q30 -8 60 0 t60 0" />
    <path d="M820 600 q30 -8 60 0 t60 0" />
    <path d="M180 820 q30 -8 60 0 t60 0" />
    <path d="M760 840 q30 -8 60 0 t60 0" />
  </g>

  <!-- 종이배 그림자와 물결 -->
  <ellipse cx="660" cy="712" rx="230" ry="20" fill="#1f4a57" opacity="0.45" />
  <g stroke="#e4f1f2" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M420 716 q40 -10 80 0" />
    <path d="M820 716 q40 -10 80 0" />
    <path d="M380 740 q50 -10 100 0" />
  </g>

  <!-- 종이배 -->
  <g filter="url(#shadow)">
    <!-- 선체 -->
    <path d="M440 600 L880 600 L800 700 L520 700 Z" fill="url(#paperShade)" />
    <path d="M440 600 L660 640 L880 600 L800 700 L520 700 Z" fill="url(#paper)" />
    <!-- 돛(삼각 접힘) -->
    <path d="M660 640 L560 600 L660 400 Z" fill="#f4f7f9" />
    <path d="M660 640 L760 600 L660 400 Z" fill="#cdd8de" />
    <path d="M660 400 L660 640" stroke="#b5c3ca" stroke-width="2" />
    <!-- 접힌 선 -->
    <path d="M440 600 L520 700 M880 600 L800 700" stroke="#b5c3ca" stroke-width="2" fill="none" />
  </g>

  <!-- 선착장 -->
  <g filter="url(#shadow)">
    <!-- 기둥 (물속) -->
    <rect x="1236" y="560" width="28" height="200" fill="#4a3324" />
    <rect x="1476" y="560" width="28" height="220" fill="#4a3324" />
    <!-- 바닥 판자 -->
    <path d="M1180 560 L1600 540 L1600 580 L1180 596 Z" fill="url(#plank)" />
    <g stroke="#6a4a31" stroke-width="2">
      <path d="M1260 557 L1260 593" />
      <path d="M1340 554 L1340 590" />
      <path d="M1420 551 L1420 587" />
      <path d="M1500 548 L1500 584" />
    </g>
    <!-- 앞 기둥 (높게) -->
    <rect x="1196" y="360" width="44" height="420" rx="6" fill="url(#wood)" />
    <ellipse cx="1218" cy="360" rx="22" ry="8" fill="#a47b56" />
    <!-- 밧줄 -->
    <path d="M1196 430 q22 14 44 0" stroke="#d9c39a" stroke-width="6" fill="none" />
    <path d="M1196 444 q22 14 44 0" stroke="#c9b083" stroke-width="6" fill="none" />
  </g>

  <!-- 가격표: 기둥에 끈으로 걸림 -->
  <path d="M1218 450 L1150 486" stroke="#3f2c1f" stroke-width="3" fill="none" />
  <g filter="url(#shadow)" transform="rotate(-12 1100 520)">
    <path d="M1040 470 L1130 470 L1160 520 L1130 570 L1040 570 Z" fill="url(#tag)" />
    <circle cx="1136" cy="520" r="8" fill="#fbe3c6" />
    <text x="1084" y="546" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>
  </g>

  <!-- 모래시계: 기둥 위 -->
  <g filter="url(#shadow)" transform="translate(1218 300)">
    <rect x="-40" y="-60" width="80" height="12" rx="4" fill="#6b4a33" />
    <rect x="-40" y="48" width="80" height="12" rx="4" fill="#6b4a33" />
    <path d="M-30 -48 L30 -48 L4 0 L30 48 L-30 48 L-4 0 Z" fill="url(#glass)" stroke="#8aa9b0" stroke-width="2" />
    <!-- 모래: 위에 조금, 아래에 많이 -->
    <path d="M-14 -22 L14 -22 L4 -4 L-4 -4 Z" fill="#f2b56b" />
    <path d="M-26 46 L26 46 L12 24 L-12 24 Z" fill="#f2b56b" />
    <path d="M0 -4 L0 24" stroke="#f2b56b" stroke-width="2" />
  </g>
</svg>
