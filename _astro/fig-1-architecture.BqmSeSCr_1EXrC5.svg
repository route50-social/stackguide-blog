<!-- 그림 1: Lightsail 인스턴스 한 대에 Nginx, Next.js, PostgreSQL을 함께 두는 배포 구조와 방화벽에서 열고 닫는 포트 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">Lightsail 서버 한 대에 Next.js와 PostgreSQL을 올린 배포 구조</title>
  <desc id="fig1-desc">방문자 브라우저는 DNS로 도메인의 고정 IP를 찾은 뒤 요청을 보냅니다. 요청은 Lightsail 방화벽에서 열린 80·443번 포트를 지나 인스턴스 안의 Nginx에 도착하고, Nginx는 127.0.0.1:3000의 Next.js로 넘깁니다. Next.js는 localhost:5432의 PostgreSQL을 조회합니다. 3000번과 5432번은 방화벽에서 열지 않아 외부에서 접근할 수 없고, 관리용 SSH는 22번으로 들어옵니다.</desc>
  <defs>
    <marker id="f1-arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M5 2 L12 7 L5 12" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    </marker>
    <marker id="f1-arrow-ok" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M5 2 L12 7 L5 12" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    </marker>
  </defs>

  <rect width="1200" height="760" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="758" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="88" font-size="36" font-weight="700" fill="#1e293b">서버 한 대에 웹 서버·앱·DB를 함께 둔 구조</text>
    <text x="64" y="132" font-size="24" fill="#475569">외부에는 80·443(웹)과 22(SSH)만 열고, 3000·5432는 서버 안에서만 씁니다</text>

    <!-- 방문자와 DNS -->
    <rect x="64" y="232" width="216" height="128" rx="16" fill="#e0e7ff" stroke="#94a3b8" stroke-width="2" />
    <text x="172" y="284" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">방문자 브라우저</text>
    <text x="172" y="324" font-size="22" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">https://도메인</text>

    <rect x="64" y="456" width="216" height="128" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <text x="172" y="508" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">DNS</text>
    <text x="172" y="548" font-size="22" fill="#475569" text-anchor="middle">A 레코드 → 고정 IP</text>
    <path d="M140 360 V452" stroke="#334155" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#f1-arrow)" />
    <path d="M204 452 V364" stroke="#334155" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#f1-arrow)" />
    <text x="216" y="416" font-size="22" fill="#475569">주소 조회</text>

    <!-- Lightsail 인스턴스 -->
    <rect x="392" y="184" width="744" height="472" rx="20" fill="#ffffff" stroke="#475569" stroke-width="2.5" />
    <text x="424" y="228" font-size="26" font-weight="700" fill="#1e293b">Lightsail 인스턴스</text>
    <text x="424" y="262" font-size="22" fill="#475569">Ubuntu 24.04 · 고정 IP · 서울 리전</text>

    <!-- 방화벽 -->
    <rect x="362" y="184" width="20" height="472" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <text x="372" y="684" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">Lightsail 방화벽</text>

    <!-- 브라우저 → Nginx -->
    <path d="M280 296 H452" stroke="#15803d" stroke-width="3.5" fill="none" marker-end="url(#f1-arrow-ok)" />
    <text x="286" y="282" font-size="22" font-weight="700" fill="#15803d">80·443</text>

    <!-- 구성 요소 -->
    <rect x="456" y="296" width="200" height="144" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="556" y="348" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">Nginx</text>
    <text x="556" y="384" font-size="22" fill="#475569" text-anchor="middle">리버스 프록시</text>
    <text x="556" y="416" font-size="22" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">:80 :443</text>

    <rect x="704" y="296" width="200" height="144" rx="16" fill="#dbeafe" stroke="#64748b" stroke-width="2" />
    <text x="804" y="348" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">Next.js</text>
    <text x="804" y="384" font-size="22" fill="#475569" text-anchor="middle">Node.js 24</text>
    <text x="804" y="416" font-size="22" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">127.0.0.1:3000</text>

    <rect x="952" y="296" width="160" height="144" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    <text x="1032" y="348" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">PostgreSQL</text>
    <text x="1032" y="384" font-size="22" fill="#475569" text-anchor="middle">버전 16</text>
    <text x="1032" y="416" font-size="22" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">:5432</text>

    <path d="M656 368 H700" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#f1-arrow)" />
    <path d="M904 368 H948" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#f1-arrow)" />

    <!-- 서버 안의 관리 요소 -->
    <rect x="456" y="488" width="320" height="128" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6" />
    <text x="480" y="532" font-size="24" font-weight="700" fill="#334155">systemd</text>
    <text x="480" y="568" font-size="22" fill="#475569">Next.js 상시 실행,</text>
    <text x="480" y="600" font-size="22" fill="#475569">멈추면 자동 재시작</text>

    <rect x="808" y="488" width="304" height="128" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6" />
    <text x="832" y="532" font-size="24" font-weight="700" fill="#334155">백업</text>
    <text x="832" y="568" font-size="22" fill="#475569">자동 스냅샷(디스크 전체)</text>
    <text x="832" y="600" font-size="22" fill="#475569">+ pg_dump(DB만)</text>

    <!-- 관리자 SSH -->
    <rect x="64" y="616" width="216" height="80" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <text x="172" y="666" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">관리자 SSH</text>
    <path d="M280 640 H356" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#f1-arrow-ok)" />
    <text x="292" y="624" font-size="22" font-weight="700" fill="#15803d">22</text>

    <!-- 범례 -->
    <g font-size="22" fill="#334155">
      <path d="M760 720 H808" stroke="#15803d" stroke-width="3.5" />
      <text x="820" y="728">방화벽에서 연 포트</text>
      <rect x="1000" y="708" width="40" height="24" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" />
      <text x="1052" y="728">서버 내부</text>
    </g>
  </g>
</svg>
