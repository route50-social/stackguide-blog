<!-- 그림 1: 클라우드 AI와 로컬 LLM에서 질문이 처리되는 위치를 비교한 흐름도 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">질문이 처리되는 곳: 클라우드 AI와 로컬 LLM</title>
  <desc id="fig1-desc">클라우드 AI는 내 기기에서 입력한 질문이 HTTPS로 인터넷을 거쳐 사업자 데이터센터로 가고, 그곳에서 모델이 실행되며 대화 기록이 저장됩니다. 로컬 LLM은 앱, 127.0.0.1:11434에서 기다리는 Ollama 서버, 모델 파일이 모두 내 컴퓨터 안에 있습니다. 다만 Ollama에서 cloud 태그 모델을 고르면 질문이 외부 서버로 나갑니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M5 2 L12 7 L5 12" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M5 2 L12 7 L5 12" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    </marker>
  </defs>

  <rect width="1200" height="960" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="958" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="96" font-size="40" font-weight="700" fill="#1e293b">질문이 처리되는 곳</text>
    <text x="64" y="144" font-size="26" fill="#475569">클라우드 AI는 사업자 서버에서, 로컬 LLM은 내 컴퓨터 안에서 계산합니다</text>

    <!-- 위쪽: 클라우드 AI -->
    <text x="64" y="212" font-size="26" font-weight="700" fill="#1d4ed8">클라우드 AI (예: ChatGPT)</text>
    <g stroke="#94a3b8" stroke-width="2" fill="#dbeafe">
      <rect x="64" y="236" width="320" height="152" rx="16" />
      <rect x="432" y="236" width="320" height="152" rx="16" />
      <rect x="800" y="236" width="320" height="152" rx="16" />
    </g>
    <g fill="#ffffff" stroke="#64748b" stroke-width="2">
      <circle cx="104" cy="276" r="22" />
      <circle cx="472" cy="276" r="22" />
      <circle cx="840" cy="276" r="22" />
    </g>
    <g font-size="24" font-weight="700" fill="#334155" text-anchor="middle">
      <text x="104" y="284">1</text>
      <text x="472" y="284">2</text>
      <text x="840" y="284">3</text>
    </g>
    <g font-size="28" font-weight="700" fill="#1e293b">
      <text x="88" y="336">내 PC·휴대폰</text>
      <text x="456" y="336">인터넷 전송</text>
      <text x="824" y="336">사업자 데이터센터</text>
    </g>
    <g font-size="22" fill="#475569">
      <text x="88" y="370">브라우저·앱에 질문 입력</text>
      <text x="456" y="370">HTTPS로 암호화해 보냄</text>
      <text x="824" y="370">모델 실행 · 대화 기록 저장</text>
    </g>
    <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M384 312 H428" />
      <path d="M752 312 H796" />
    </g>
    <text x="64" y="436" font-size="22" fill="#475569">보관 기간과 학습 사용 여부는 요금제와 설정에 따라 달라집니다</text>

    <!-- 아래쪽: 로컬 LLM -->
    <text x="64" y="508" font-size="26" font-weight="700" fill="#0f766e">로컬 LLM (예: Ollama)</text>
    <rect x="64" y="524" width="1072" height="216" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" stroke-dasharray="12 8" />
    <text x="1104" y="556" font-size="22" font-weight="600" fill="#0f766e" text-anchor="end">내 컴퓨터 안</text>
    <g stroke="#94a3b8" stroke-width="2" fill="#ccfbf1">
      <rect x="96" y="572" width="304" height="144" rx="16" />
      <rect x="448" y="572" width="304" height="144" rx="16" />
      <rect x="800" y="572" width="304" height="144" rx="16" />
    </g>
    <g fill="#ffffff" stroke="#64748b" stroke-width="2">
      <circle cx="136" cy="608" r="22" />
      <circle cx="488" cy="608" r="22" />
      <circle cx="840" cy="608" r="22" />
    </g>
    <g font-size="24" font-weight="700" fill="#334155" text-anchor="middle">
      <text x="136" y="616">1</text>
      <text x="488" y="616">2</text>
      <text x="840" y="616">3</text>
    </g>
    <g font-size="28" font-weight="700" fill="#1e293b">
      <text x="120" y="664">앱·터미널</text>
      <text x="472" y="664">Ollama 서버</text>
      <text x="824" y="664">모델 파일</text>
    </g>
    <g font-size="22" fill="#475569">
      <text x="120" y="698">질문 입력</text>
      <text x="824" y="698">GPU·메모리에서 계산</text>
    </g>
    <text x="472" y="698" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" fill="#475569">127.0.0.1:11434</text>
    <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M400 644 H444" />
      <path d="M752 644 H796" />
    </g>

    <!-- 선택 시에만 생기는 외부 경로 -->
    <path d="M600 716 V780" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-warn)" />
    <rect x="448" y="784" width="304" height="72" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="600" y="829" font-size="24" font-weight="700" fill="#b45309" text-anchor="middle">외부 서버 (클라우드)</text>
    <g font-size="22" fill="#b45309">
      <text x="784" y="812">cloud 태그 모델을 고르면</text>
      <text x="784" y="844">질문이 외부 서버로 나갑니다</text>
    </g>

    <!-- 범례 -->
    <g font-size="22" fill="#334155">
      <path d="M64 904 H112" stroke="#334155" stroke-width="3" />
      <text x="128" y="912">질문과 답이 오가는 경로</text>
      <path d="M448 904 H496" stroke="#b45309" stroke-width="3" stroke-dasharray="10 8" />
      <text x="512" y="912">해당 모델을 골랐을 때만 생기는 경로</text>
    </g>
  </g>
</svg>
