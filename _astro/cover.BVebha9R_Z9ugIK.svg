<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="cover-title cover-desc">
  <!-- 표지: 아침 햇살이 드는 작업대. 왼쪽은 가격표 하나가 붙은 도시락 상자(묶음 요금), 오른쪽은 가격표를 하나씩 단 부품 상자 네 개(항목별 요금) -->
  <title id="cover-title">가격표 하나 붙은 도시락 상자와 가격표를 따로 단 부품 상자들</title>
  <desc id="cover-desc">작업대 왼쪽에는 칸이 나뉜 도시락 상자 하나에 주황색 가격표 한 장이 붙어 있고, 오른쪽 쟁반에는 서버, 디스크, 연결 단자, 전송 신호를 상징하는 작은 상자 네 개가 각자 가격표를 달고 놓여 있습니다.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3b4d" />
      <stop offset="1" stop-color="#2f5b6e" />
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#fcd34d" stop-opacity="0.12" />
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c08a57" />
      <stop offset="1" stop-color="#8a5a32" />
    </linearGradient>
    <linearGradient id="benchEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4b28" />
      <stop offset="1" stop-color="#4a2c16" />
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0" />
      <stop offset="1" stop-color="#b6c2d1" />
    </linearGradient>
    <linearGradient id="boxBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8" />
      <stop offset="1" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1" />
      <stop offset="1" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="part" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9" />
      <stop offset="1" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1c1208" flood-opacity="0.45" />
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1c1208" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 배경: 벽과 창빛 -->
  <rect width="1600" height="900" fill="url(#wall)" />
  <rect width="1600" height="900" fill="url(#sun)" />
  <g fill="#fef3c7" opacity="0.08">
    <polygon points="1040,0 1240,0 900,560 700,560" />
    <polygon points="1300,0 1420,0 1120,560 1000,560" />
  </g>
  <!-- 벽 선반의 공구 실루엣 -->
  <g opacity="0.35" fill="#16303f">
    <rect x="120" y="150" width="420" height="14" rx="4" />
    <rect x="150" y="96" width="40" height="54" rx="6" />
    <rect x="206" y="78" width="28" height="72" rx="6" />
    <rect x="250" y="110" width="70" height="40" rx="8" />
    <circle cx="380" cy="122" r="28" />
    <rect x="430" y="90" width="60" height="60" rx="8" />
  </g>

  <!-- 작업대 -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#bench)" />
  <rect x="0" y="548" width="1600" height="20" fill="#d6a273" />
  <g stroke="#7a4b28" stroke-width="3" opacity="0.35" fill="none">
    <path d="M0 640 C 300 630, 600 652, 900 640 S 1400 630, 1600 646" />
    <path d="M0 730 C 260 720, 640 744, 980 728 S 1420 720, 1600 736" />
    <path d="M0 820 C 340 812, 700 830, 1040 816 S 1440 810, 1600 824" />
  </g>
  <rect x="0" y="880" width="1600" height="20" fill="url(#benchEdge)" />

  <!-- 왼쪽: 도시락 상자 (묶음) -->
  <g filter="url(#shadow)">
    <rect x="212" y="452" width="520" height="252" rx="28" fill="url(#boxBody)" />
    <rect x="200" y="420" width="544" height="72" rx="26" fill="url(#lid)" />
    <rect x="200" y="470" width="544" height="22" fill="#a5b2c3" />
  </g>
  <!-- 뚜껑 위 끈 -->
  <rect x="440" y="420" width="64" height="284" fill="#0f766e" opacity="0.9" />
  <rect x="200" y="530" width="532" height="40" fill="#0f766e" opacity="0.9" />
  <!-- 앞면 칸막이 창(내용물이 비치는 창) -->
  <g>
    <rect x="236" y="586" width="188" height="96" rx="14" fill="#1e293b" opacity="0.85" />
    <rect x="520" y="586" width="188" height="96" rx="14" fill="#1e293b" opacity="0.85" />
    <!-- 창 안의 서버 칸과 디스크 칸 -->
    <rect x="256" y="604" width="148" height="20" rx="6" fill="#94a3b8" />
    <rect x="256" y="636" width="148" height="20" rx="6" fill="#94a3b8" />
    <circle cx="388" cy="614" r="5" fill="#4ade80" />
    <circle cx="388" cy="646" r="5" fill="#4ade80" />
    <circle cx="614" cy="634" r="34" fill="#cbd5e1" />
    <circle cx="614" cy="634" r="10" fill="#475569" />
  </g>
  <!-- 큰 가격표 하나 -->
  <g filter="url(#softShadow)">
    <path d="M760 360 L748 430" stroke="#f8fafc" stroke-width="4" />
    <path d="M746 352 L872 352 L908 394 L872 436 L746 436 Z" fill="url(#tag)" transform="rotate(14 820 394)" />
    <circle cx="884" cy="404" r="9" fill="#7c2d12" transform="rotate(14 820 394)" />
    <g transform="rotate(14 820 394)" stroke="#fff7ed" stroke-width="7" stroke-linecap="round">
      <path d="M772 382 H842" />
      <path d="M772 408 H822" />
    </g>
  </g>

  <!-- 오른쪽: 쟁반과 부품 상자 네 개 (항목별) -->
  <g filter="url(#shadow)">
    <rect x="900" y="620" width="560" height="64" rx="18" fill="url(#tray)" />
    <rect x="916" y="606" width="528" height="30" rx="14" fill="#e2e8f0" />
  </g>
  <!-- 부품 1: 서버 상자 -->
  <g filter="url(#softShadow)">
    <rect x="936" y="500" width="112" height="116" rx="14" fill="url(#part)" />
    <rect x="952" y="522" width="80" height="16" rx="4" fill="#64748b" />
    <rect x="952" y="548" width="80" height="16" rx="4" fill="#64748b" />
    <rect x="952" y="574" width="80" height="16" rx="4" fill="#64748b" />
    <circle cx="1022" cy="530" r="4" fill="#4ade80" />
    <circle cx="1022" cy="556" r="4" fill="#4ade80" />
  </g>
  <!-- 부품 2: 디스크 상자 -->
  <g filter="url(#softShadow)">
    <rect x="1068" y="512" width="112" height="104" rx="14" fill="url(#part)" />
    <circle cx="1124" cy="564" r="36" fill="#cbd5e1" stroke="#64748b" stroke-width="4" />
    <circle cx="1124" cy="564" r="10" fill="#475569" />
  </g>
  <!-- 부품 3: 연결 단자(주소) 상자 -->
  <g filter="url(#softShadow)">
    <rect x="1200" y="524" width="104" height="92" rx="14" fill="url(#part)" />
    <rect x="1230" y="550" width="44" height="34" rx="6" fill="#475569" />
    <rect x="1240" y="584" width="24" height="16" rx="3" fill="#64748b" />
    <rect x="1238" y="558" width="8" height="12" fill="#e2e8f0" />
    <rect x="1258" y="558" width="8" height="12" fill="#e2e8f0" />
  </g>
  <!-- 부품 4: 전송 신호 상자 -->
  <g filter="url(#softShadow)">
    <rect x="1324" y="508" width="104" height="108" rx="14" fill="url(#part)" />
    <g fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round">
      <path d="M1352 584 A 24 24 0 0 1 1400 584" />
      <path d="M1340 572 A 38 38 0 0 1 1412 572" />
    </g>
    <circle cx="1376" cy="590" r="7" fill="#0f766e" />
  </g>
  <!-- 작은 가격표 네 장 -->
  <g fill="url(#tag)" stroke="#fff7ed" stroke-width="2">
    <path d="M992 500 L986 452" fill="none" stroke="#f8fafc" stroke-width="3" />
    <path d="M960 420 L1012 420 L1028 440 L1012 460 L960 460 Z" transform="rotate(-8 994 440)" />
    <path d="M1124 512 L1132 470" fill="none" stroke="#f8fafc" stroke-width="3" />
    <path d="M1104 436 L1156 436 L1172 456 L1156 476 L1104 476 Z" transform="rotate(10 1138 456)" />
    <path d="M1252 524 L1246 486" fill="none" stroke="#f8fafc" stroke-width="3" />
    <path d="M1222 452 L1274 452 L1290 472 L1274 492 L1222 492 Z" transform="rotate(-6 1256 472)" />
    <path d="M1376 508 L1386 466" fill="none" stroke="#f8fafc" stroke-width="3" />
    <path d="M1356 430 L1408 430 L1424 450 L1408 470 L1356 470 Z" transform="rotate(12 1390 450)" />
  </g>
  <g stroke="#fff7ed" stroke-width="5" stroke-linecap="round">
    <path d="M972 438 H1000" transform="rotate(-8 994 440)" />
    <path d="M1116 454 H1144" transform="rotate(10 1138 456)" />
    <path d="M1234 470 H1262" transform="rotate(-6 1256 472)" />
    <path d="M1368 448 H1396" transform="rotate(12 1390 450)" />
  </g>

  <!-- 가운데 작은 연필과 메모지: 비교하는 장면 -->
  <g filter="url(#softShadow)">
    <rect x="770" y="720" width="150" height="110" rx="6" fill="#fefce8" transform="rotate(-6 845 775)" />
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" transform="rotate(-6 845 775)">
      <path d="M790 748 H896" />
      <path d="M790 772 H880" />
      <path d="M790 796 H868" />
    </g>
    <g transform="rotate(-32 900 760)">
      <rect x="840" y="752" width="150" height="16" rx="4" fill="#f59e0b" />
      <polygon points="990,752 1014,760 990,768" fill="#fde68a" />
      <rect x="826" y="752" width="16" height="16" rx="3" fill="#fda4af" />
    </g>
  </g>
</svg>
