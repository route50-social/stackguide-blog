<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="cover-title cover-desc">
  <!-- 표지: 밝은 낮의 책상. 왼쪽의 종이 시험지·초시계(예전 평가)와 오른쪽의 AI 대화창이 뜬 노트북, 코드 한 줄을 살피는 돋보기(새 평가)를 함께 놓은 장면 -->
  <title id="cover-title">종이 시험지 옆, AI 대화창이 뜬 노트북과 코드를 살피는 돋보기</title>
  <desc id="cover-desc">창으로 낮 햇빛이 드는 책상 위 왼쪽에 연필을 올린 답안지와 초시계가 놓여 있고, 가운데 노트북 화면 왼쪽에는 코드가, 오른쪽에는 AI와 주고받은 대화 말풍선이 떠 있습니다. 돋보기가 화면의 코드 한 줄을 크게 비추며 그 줄의 문제를 붉은 밑줄로 짚고 있습니다.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f6" />
      <stop offset="1" stop-color="#d3dee6" />
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8bb93" />
      <stop offset="1" stop-color="#b98f63" />
    </linearGradient>
    <linearGradient id="deskEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7149" />
      <stop offset="1" stop-color="#7d5737" />
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4452" />
      <stop offset="1" stop-color="#232a35" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16202e" />
      <stop offset="1" stop-color="#0d1520" />
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ced6" />
      <stop offset="1" stop-color="#9aa2ae" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#eef0f2" />
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#bfe9e4" stop-opacity="0.12" />
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5e7eb" />
      <stop offset="1" stop-color="#8b929c" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="softSmall" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <clipPath id="lensClip">
      <circle cx="930" cy="372" r="74" />
    </clipPath>
  </defs>

  <!-- 벽과 햇빛 -->
  <rect width="1600" height="900" fill="url(#wall)" />
  <path d="M1040 0 H1360 L860 640 H540 Z" fill="url(#sunbeam)" opacity="0.6" />
  <path d="M1420 0 H1560 L1060 640 H920 Z" fill="url(#sunbeam)" opacity="0.45" />

  <!-- 책상 -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#desk)" />
  <rect x="0" y="600" width="1600" height="10" fill="#e6cfad" />
  <rect x="0" y="862" width="1600" height="38" fill="url(#deskEdge)" />
  <g stroke="#c7a47a" stroke-width="3" fill="none" opacity="0.55">
    <path d="M0 680 C300 670 520 700 860 684 S1400 672 1600 690" />
    <path d="M0 772 C260 760 600 790 960 770 S1380 760 1600 780" />
  </g>

  <!-- 노트북 그림자 -->
  <ellipse cx="870" cy="640" rx="400" ry="26" fill="#5a3f27" opacity="0.35" filter="url(#soft)" />

  <!-- 노트북 화면 -->
  <rect x="600" y="176" width="540" height="398" rx="18" fill="url(#bezel)" />
  <rect x="624" y="200" width="492" height="350" rx="6" fill="url(#screen)" />

  <!-- 화면 왼쪽: 코드 -->
  <g>
    <rect x="648" y="226" width="12" height="12" rx="6" fill="#f2665b" />
    <rect x="668" y="226" width="12" height="12" rx="6" fill="#94a3b8" />
    <rect x="688" y="226" width="12" height="12" rx="6" fill="#94a3b8" />
    <g fill="#5b6b80">
      <rect x="648" y="262" width="16" height="8" rx="4" />
      <rect x="648" y="290" width="16" height="8" rx="4" />
      <rect x="648" y="318" width="16" height="8" rx="4" />
      <rect x="648" y="346" width="16" height="8" rx="4" />
      <rect x="648" y="374" width="16" height="8" rx="4" />
      <rect x="648" y="402" width="16" height="8" rx="4" />
