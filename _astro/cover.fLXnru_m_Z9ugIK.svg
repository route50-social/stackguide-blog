    <path d="M300 530 V476 A54 54 0 0 1 346 504 Z" fill="#14b8a6" opacity="0.25" />
    <path d="M300 530 L346 504" stroke="#1f2937" stroke-width="5" stroke-linecap="round" />
    <path d="M300 530 V484" stroke="#1f2937" stroke-width="4" stroke-linecap="round" />
    <circle cx="300" cy="530" r="7" fill="#1f2937" />
  </g>

  <!-- 오른쪽: 머그컵 -->
  <g>
    <ellipse cx="1400" cy="672" rx="74" ry="12" fill="#5a3f27" opacity="0.3" filter="url(#softSmall)" />
    <path d="M1340 560 H1452 L1444 664 Q1442 676 1430 676 H1362 Q1350 676 1348 664 Z" fill="#f2665b" />
    <path d="M1452 584 q44 4 40 40 q-4 32 -46 30" fill="none" stroke="#d9534a" stroke-width="14" />
    <ellipse cx="1396" cy="560" rx="56" ry="12" fill="#c4473f" />
    <ellipse cx="1396" cy="562" rx="48" ry="8" fill="#5b3a26" />
    <path d="M1376 540 q-12 -24 4 -44 M1406 536 q-10 -22 6 -44" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6" />
