      <rect x="648" y="458" width="16" height="8" rx="4" />
      <rect x="648" y="486" width="16" height="8" rx="4" />
      <rect x="648" y="514" width="16" height="8" rx="4" />
    </g>
    <rect x="680" y="262" width="96" height="8" rx="4" fill="#7dd3c8" />
    <rect x="784" y="262" width="120" height="8" rx="4" fill="#cbd5e1" />
    <rect x="704" y="290" width="72" height="8" rx="4" fill="#f9b4ad" />
    <rect x="784" y="290" width="88" height="8" rx="4" fill="#cbd5e1" />
    <rect x="704" y="318" width="150" height="8" rx="4" fill="#cbd5e1" />
    <rect x="728" y="346" width="60" height="8" rx="4" fill="#7dd3c8" />
    <rect x="796" y="346" width="100" height="8" rx="4" fill="#cbd5e1" />
    <rect x="728" y="374" width="140" height="8" rx="4" fill="#cbd5e1" />
    <rect x="728" y="402" width="84" height="8" rx="4" fill="#f9b4ad" />
    <rect x="820" y="402" width="60" height="8" rx="4" fill="#cbd5e1" />
    <rect x="704" y="430" width="40" height="8" rx="4" fill="#7dd3c8" />
    <rect x="704" y="458" width="132" height="8" rx="4" fill="#cbd5e1" />
    <rect x="680" y="486" width="24" height="8" rx="4" fill="#cbd5e1" />
    <rect x="680" y="514" width="108" height="8" rx="4" fill="#7dd3c8" />
  </g>

  <!-- 화면 오른쪽: AI 대화창 -->
  <rect x="924" y="214" width="2" height="322" fill="#2c3a4d" />
  <g>
    <rect x="944" y="232" width="148" height="56" rx="14" fill="#2a3648" />
    <rect x="960" y="248" width="104" height="8" rx="4" fill="#94a3b8" />
    <rect x="960" y="266" width="72" height="8" rx="4" fill="#94a3b8" />
    <rect x="968" y="306" width="128" height="92" rx="14" fill="#14b8a6" />
    <rect x="984" y="324" width="96" height="8" rx="4" fill="#e6fffb" />
    <rect x="984" y="342" width="80" height="8" rx="4" fill="#e6fffb" />
    <rect x="984" y="360" width="92" height="8" rx="4" fill="#e6fffb" />
    <rect x="984" y="378" width="56" height="8" rx="4" fill="#e6fffb" />
    <rect x="944" y="416" width="132" height="44" rx="14" fill="#2a3648" />
    <rect x="960" y="434" width="88" height="8" rx="4" fill="#94a3b8" />
    <rect x="944" y="494" width="148" height="32" rx="16" fill="none" stroke="#3d4d63" stroke-width="2" />
    <circle cx="1074" cy="510" r="9" fill="#14b8a6" />
  </g>

  <!-- 노트북 바닥판 -->
  <path d="M560 574 H1180 L1222 618 H518 Z" fill="url(#base)" />
  <rect x="518" y="614" width="704" height="10" rx="5" fill="#7f8794" />
  <rect x="812" y="580" width="116" height="8" rx="4" fill="#aab1bc" />

  <!-- 돋보기: 코드 한 줄을 확대해 문제를 짚음 -->
  <g>
    <ellipse cx="1088" cy="650" rx="90" ry="12" fill="#5a3f27" opacity="0.3" filter="url(#softSmall)" />
    <path d="M982 428 L1100 610" stroke="#2f3a48" stroke-width="30" stroke-linecap="round" />
    <path d="M982 428 L1100 610" stroke="#4b5a6c" stroke-width="16" stroke-linecap="round" />
    <path d="M974 416 L996 450" stroke="url(#metal)" stroke-width="34" stroke-linecap="round" />
    <g clip-path="url(#lensClip)">
      <rect x="840" y="290" width="180" height="170" fill="#121c29" />
      <rect x="846" y="352" width="140" height="16" rx="8" fill="#f9b4ad" />
      <rect x="846" y="320" width="96" height="14" rx="7" fill="#cbd5e1" opacity="0.7" />
      <rect x="846" y="390" width="120" height="14" rx="7" fill="#cbd5e1" opacity="0.7" />
      <path d="M846 378 q12 -8 24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#f2665b" stroke-width="5" stroke-linecap="round" />
      <circle cx="930" cy="372" r="74" fill="url(#lens)" />
    </g>
    <circle cx="930" cy="372" r="74" fill="none" stroke="#2f3a48" stroke-width="16" />
    <circle cx="930" cy="372" r="74" fill="none" stroke="url(#metal)" stroke-width="6" />
    <path d="M884 336 a56 56 0 0 1 40 -22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- 왼쪽: 답안지와 연필 -->
  <g>
    <path d="M150 712 L470 660 L560 846 L190 880 Z" fill="#5a3f27" opacity="0.28" filter="url(#softSmall)" />
    <path d="M140 700 L460 650 L548 836 L176 868 Z" fill="url(#paper)" />
    <path d="M140 700 L460 650 L548 836 L176 868 Z" fill="none" stroke="#d4d8dd" stroke-width="2" />
    <g fill="none" stroke="#94a3b8" stroke-width="3">
      <ellipse cx="228" cy="726" rx="13" ry="8" />
      <ellipse cx="270" cy="720" rx="13" ry="8" />
      <ellipse cx="312" cy="713" rx="13" ry="8" />
      <ellipse cx="354" cy="707" rx="13" ry="8" />
      <ellipse cx="236" cy="764" rx="14" ry="8" />
      <ellipse cx="280" cy="758" rx="14" ry="8" />
      <ellipse cx="324" cy="751" rx="14" ry="8" />
      <ellipse cx="368" cy="745" rx="14" ry="8" />
      <ellipse cx="246" cy="804" rx="15" ry="9" />
      <ellipse cx="292" cy="798" rx="15" ry="9" />
      <ellipse cx="338" cy="791" rx="15" ry="9" />
      <ellipse cx="384" cy="784" rx="15" ry="9" />
    </g>
    <g fill="#475569">
      <ellipse cx="270" cy="720" rx="11" ry="6" />
      <ellipse cx="368" cy="745" rx="12" ry="6" />
      <ellipse cx="292" cy="798" rx="13" ry="7" />
    </g>
    <path d="M170 690 L400 654" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <!-- 연필 -->
    <path d="M300 860 L520 738" stroke="#5a3f27" stroke-width="22" stroke-linecap="round" opacity="0.25" filter="url(#softSmall)" />
    <path d="M296 846 L506 726" stroke="#d6c3a3" stroke-width="20" stroke-linecap="butt" />
    <path d="M296 846 L506 726" stroke="#e8dcc6" stroke-width="8" stroke-linecap="butt" />
    <path d="M506 726 L540 708 L516 744 Z" fill="#e3c9a3" />
    <path d="M530 714 L540 708 L534 719 Z" fill="#374151" />
    <path d="M282 854 L298 845" stroke="#9aa2ae" stroke-width="22" />
    <path d="M266 863 L284 853" stroke="#f2665b" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- 왼쪽 뒤: 초시계 -->
  <g>
    <ellipse cx="300" cy="610" rx="86" ry="12" fill="#5a3f27" opacity="0.3" filter="url(#softSmall)" />
    <rect x="286" y="428" width="28" height="22" rx="4" fill="#6b7280" />
    <rect x="276" y="414" width="48" height="18" rx="9" fill="#9aa2ae" />
    <path d="M360 452 l22 -18" stroke="#6b7280" stroke-width="12" stroke-linecap="round" />
    <circle cx="300" cy="530" r="84" fill="#4b5563" />
    <circle cx="300" cy="530" r="72" fill="#f8fafc" />
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <path d="M300 466 V478" />
      <path d="M364 530 H352" />
      <path d="M300 594 V582" />
      <path d="M236 530 H248" />
