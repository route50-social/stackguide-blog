<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="cover-title cover-desc">
  <!-- 표지: 첫 서비스를 올릴 인프라를 고르는 갈림길. 세 갈래 길 끝에 크기가 다른 건물 세 채 -->
  <title id="cover-title">세 갈래 길 앞의 이정표</title>
  <desc id="cover-desc">해 질 녘 하늘 아래 길이 세 갈래로 나뉘고, 왼쪽 끝에는 높은 유리 빌딩, 가운데에는 서버 창이 줄지어 있는 데이터센터 건물, 오른쪽 끝에는 차양을 단 작은 가게가 서 있습니다. 갈림길 앞에는 방향이 다른 팻말 세 개를 단 이정표와 작은 상자 하나가 놓여 있습니다.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3a66" />
      <stop offset="0.55" stop-color="#8a6f9e" />
      <stop offset="1" stop-color="#f2b38a" />
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2b8" stop-opacity="0.95" />
      <stop offset="0.35" stop-color="#ffc98f" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffc98f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4e69" />
      <stop offset="1" stop-color="#22223b" />
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a7b8" />
      <stop offset="1" stop-color="#6d6a80" />
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d5a80" />
      <stop offset="0.6" stop-color="#4f73a1" />
      <stop offset="1" stop-color="#2b3f5c" />
    </linearGradient>
    <linearGradient id="dc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b4f63" />
      <stop offset="0.6" stop-color="#5d6279" />
      <stop offset="1" stop-color="#383b4b" />
    </linearGradient>
    <linearGradient id="shop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5c58" />
      <stop offset="1" stop-color="#5b4441" />
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c4033" />
      <stop offset="0.5" stop-color="#7a5642" />
      <stop offset="1" stop-color="#4a3328" />
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7cf" />
      <stop offset="1" stop-color="#e2cba8" />
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b872" />
      <stop offset="1" stop-color="#c98f45" />
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0b0b1a" flood-opacity="0.45" />
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <!-- 하늘과 해 -->
  <rect width="1600" height="900" fill="url(#sky)" />
  <circle cx="800" cy="470" r="380" fill="url(#sun)" />
  <g fill="#ffffff" opacity="0.7">
    <circle cx="220" cy="120" r="2.5" />
    <circle cx="410" cy="70" r="2" />
    <circle cx="1180" cy="95" r="2.5" />
    <circle cx="1390" cy="160" r="2" />
    <circle cx="980" cy="50" r="1.8" />
  </g>

  <!-- 먼 산 능선 -->
  <path d="M0 520 L180 440 L330 500 L520 420 L700 490 L860 430 L1040 495 L1230 425 L1420 490 L1600 450 V560 H0 Z" fill="#5c5677" opacity="0.65" />

  <!-- 땅 -->
  <rect x="0" y="530" width="1600" height="370" fill="url(#ground)" />

  <!-- 세 갈래 길 -->
  <g fill="url(#road)">
    <path d="M700 900 L900 900 L812 560 L788 560 Z" />
    <path d="M760 760 L840 760 L420 560 L388 560 Z" opacity="0.92" />
    <path d="M760 760 L840 760 L1212 560 L1180 560 Z" opacity="0.92" />
  </g>
  <g stroke="#f6e7cf" stroke-width="5" stroke-dasharray="26 22" stroke-linecap="round" opacity="0.55">
    <path d="M800 890 L800 580" />
  </g>

  <!-- 왼쪽: 높은 유리 빌딩 -->
  <g filter="url(#shadow)">
    <rect x="300" y="210" width="180" height="350" rx="6" fill="url(#tower)" />
    <polygon points="300,210 390,160 480,210" fill="#2b3f5c" />
  </g>
  <g fill="#ffd9a0" opacity="0.85">
    <rect x="322" y="240" width="26" height="18" /><rect x="362" y="240" width="26" height="18" /><rect x="402" y="240" width="26" height="18" /><rect x="442" y="240" width="20" height="18" />
    <rect x="322" y="280" width="26" height="18" /><rect x="402" y="280" width="26" height="18" /><rect x="442" y="280" width="20" height="18" />
    <rect x="362" y="320" width="26" height="18" /><rect x="402" y="320" width="26" height="18" />
    <rect x="322" y="360" width="26" height="18" /><rect x="362" y="360" width="26" height="18" /><rect x="442" y="360" width="20" height="18" />
    <rect x="322" y="400" width="26" height="18" /><rect x="402" y="400" width="26" height="18" />
    <rect x="362" y="440" width="26" height="18" /><rect x="402" y="440" width="26" height="18" /><rect x="442" y="440" width="20" height="18" />
    <rect x="322" y="480" width="26" height="18" /><rect x="362" y="480" width="26" height="18" />
  </g>
  <rect x="372" y="520" width="36" height="40" fill="#1f2b40" />

  <!-- 가운데: 데이터센터 건물 -->
  <g filter="url(#shadow)">
    <rect x="690" y="380" width="220" height="180" rx="8" fill="url(#dc)" />
    <rect x="680" y="368" width="240" height="20" rx="6" fill="#33364a" />
  </g>
  <g fill="#2a2c3a">
    <rect x="712" y="410" width="176" height="28" rx="4" />
    <rect x="712" y="450" width="176" height="28" rx="4" />
    <rect x="712" y="490" width="176" height="28" rx="4" />
  </g>
  <g fill="#5eead4">
    <circle cx="728" cy="424" r="5" /><circle cx="746" cy="424" r="5" />
    <circle cx="728" cy="464" r="5" />
    <circle cx="728" cy="504" r="5" /><circle cx="746" cy="504" r="5" />
  </g>
  <circle cx="746" cy="464" r="5" fill="#f59e0b" />
  <g stroke="#7b8099" stroke-width="3" stroke-linecap="round">
    <path d="M770 424 H870M770 464 H850M770 504 H864" />
  </g>

  <!-- 오른쪽: 차양을 단 작은 가게 -->
  <g filter="url(#shadow)">
    <rect x="1120" y="440" width="170" height="120" rx="6" fill="url(#shop)" />
    <polygon points="1108,440 1205,392 1302,440" fill="#4a3734" />
  </g>
  <g>
    <path d="M1116 452 H1294 L1284 482 H1126 Z" fill="#f6e7cf" />
    <g fill="#5eead4">
      <path d="M1138 452 H1162 L1158 482 H1142 Z" />
      <path d="M1186 452 H1210 L1206 482 H1190 Z" />
      <path d="M1234 452 H1258 L1254 482 H1238 Z" />
    </g>
  </g>
  <rect x="1142" y="498" width="56" height="40" rx="3" fill="#ffd9a0" opacity="0.85" />
  <rect x="1222" y="498" width="44" height="62" rx="3" fill="#3a2a28" />

  <!-- 이정표 -->
  <g transform="translate(0 50)">
  <g filter="url(#shadow)">
    <rect x="786" y="560" width="28" height="250" rx="6" fill="url(#post)" />
    <!-- 왼쪽 팻말 -->
    <path d="M800 590 H640 L612 618 L640 646 H800 Z" fill="url(#sign)" />
    <!-- 오른쪽 위 팻말 -->
    <path d="M800 656 H960 L988 684 L960 712 H800 Z" fill="url(#sign)" />
    <!-- 앞쪽(가운데) 팻말 -->
    <path d="M760 724 H880 L904 748 L880 772 H760 Z" fill="url(#sign)" />
  </g>
  <g stroke="#a07c5a" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M660 618 H780" />
    <path d="M820 684 H940" />
    <path d="M780 748 H864" />
  </g>
  <g fill="#7a5642">
    <circle cx="790" cy="618" r="4" /><circle cx="810" cy="684" r="4" /><circle cx="800" cy="748" r="4" />
  </g>
  </g>

  <g transform="translate(90 10)">
  <!-- 이정표 옆의 작은 상자(배포할 서비스) -->
  <ellipse cx="930" cy="842" rx="96" ry="14" fill="#0b0b1a" opacity="0.4" filter="url(#soft)" />
  <g filter="url(#shadow)">
    <polygon points="860,770 930,744 1000,770 930,796" fill="#f1cd92" />
    <polygon points="860,770 930,796 930,860 860,834" fill="url(#box)" />
    <polygon points="930,796 1000,770 1000,834 930,860" fill="#b57b38" />
  </g>
  <path d="M895 757 L965 783 V806" fill="none" stroke="#8a5a26" stroke-width="6" stroke-linejoin="round" opacity="0.7" />
  </g>
</svg>
