<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="cover-title cover-desc">
  <!-- 표지: 카페 탁자의 노트북 화면이 멀리 언덕 위 집 창가의 모니터 화면을 그대로 비추는 해 질 녘 장면. 원격 데스크톱의 뜻을 담음 -->
  <title id="cover-title">멀리 있는 집의 모니터를 비추는 카페 노트북</title>
  <desc id="cover-desc">해 질 녘 카페 창가 탁자에 노트북과 커피잔이 놓여 있고, 창밖 멀리 언덕 위 집의 불 켜진 창 안에 모니터가 보입니다. 두 화면에는 같은 창이 떠 있고, 그 사이를 주황색 점선 호가 잇고 있습니다.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f5a" />
      <stop offset="0.45" stop-color="#5b4a78" />
      <stop offset="0.8" stop-color="#c47a6a" />
      <stop offset="1" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3f66" />
      <stop offset="1" stop-color="#3a3355" />
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2b4a" />
      <stop offset="1" stop-color="#24213b" />
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1a2b" />
      <stop offset="1" stop-color="#26233a" />
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a3c" />
      <stop offset="1" stop-color="#5a3825" />
    </linearGradient>
    <linearGradient id="laptopBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7dbe3" />
      <stop offset="1" stop-color="#9aa1ae" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6f8f" />
      <stop offset="1" stop-color="#22465f" />
    </linearGradient>
    <radialGradient id="windowLight" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffd89a" />
      <stop offset="1" stop-color="#f2a65a" />
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2b0" stop-opacity="0.9" />
      <stop offset="1" stop-color="#ffe2b0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4efe8" />
      <stop offset="1" stop-color="#c9c1b6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="10" result="b" />
      <feComponentTransfer><feFuncA type="linear" slope="0.45" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- 실내 벽(배경 전체) -->
  <rect width="1600" height="900" fill="url(#wall)" />

  <!-- 큰 창: 바깥 풍경 -->
  <g>
    <rect x="120" y="70" width="1360" height="560" rx="6" fill="url(#sky)" />
    <circle cx="1020" cy="430" r="180" fill="url(#sunGlow)" />
    <path d="M120 470 C 320 410 520 440 700 420 C 900 398 1100 430 1300 400 C 1380 390 1440 400 1480 410 L1480 630 L120 630 Z" fill="url(#hillFar)" />
    <path d="M120 540 C 300 500 520 520 760 500 C 940 486 1060 470 1180 440 C 1280 420 1400 450 1480 470 L1480 630 L120 630 Z" fill="url(#hillNear)" />

    <!-- 언덕 위 집 -->
    <g filter="url(#shadow)">
      <path d="M1130 446 L1210 392 L1290 446 Z" fill="#3b2f4a" />
      <rect x="1146" y="446" width="128" height="78" fill="#4a3b5a" />
      <rect x="1166" y="462" width="56" height="40" rx="2" fill="url(#windowLight)" />
      <!-- 창 안의 모니터와 같은 창 -->
      <rect x="1176" y="470" width="36" height="22" rx="2" fill="#2a4c63" />
      <rect x="1180" y="474" width="20" height="12" rx="1" fill="#eef3f7" />
      <rect x="1180" y="474" width="20" height="3" fill="#f59e0b" />
      <rect x="1192" y="492" width="4" height="6" fill="#2a4c63" />
      <rect x="1236" y="476" width="22" height="48" fill="#2f2540" />
    </g>
    <circle cx="1194" cy="482" r="40" fill="url(#lampGlow)" />
  </g>

  <!-- 창틀 -->
  <rect x="120" y="70" width="1360" height="560" rx="6" fill="none" stroke="#15131f" stroke-width="22" />
  <rect x="790" y="70" width="20" height="560" fill="#15131f" />

  <!-- 노트북에서 집 창가 모니터로 이어지는 점선 호 -->
  <path d="M730 462 C 800 250 1080 250 1194 448" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 18" />
  <circle cx="1194" cy="448" r="7" fill="#f59e0b" />
  <circle cx="730" cy="462" r="7" fill="#f59e0b" />

  <!-- 탁자 -->
  <path d="M0 690 L1600 690 L1600 900 L0 900 Z" fill="url(#table)" />
  <rect x="0" y="682" width="1600" height="16" fill="#9c6a48" />

  <!-- 노트북 -->
  <g filter="url(#shadow)">
    <path d="M520 470 L940 470 Q954 470 954 484 L954 700 L506 700 L506 484 Q506 470 520 470 Z" fill="#2a2d36" />
    <rect x="526" y="490" width="408" height="190" rx="4" fill="url(#screenGlow)" />
    <!-- 노트북 화면 속 원격 창(집 모니터와 같은 모양) -->
    <rect x="590" y="520" width="280" height="140" rx="6" fill="#eef3f7" />
    <rect x="590" y="520" width="280" height="26" rx="6" fill="#f59e0b" />
    <rect x="590" y="536" width="280" height="10" fill="#f59e0b" />
    <rect x="612" y="566" width="150" height="12" rx="6" fill="#94a3b8" />
    <rect x="612" y="590" width="220" height="12" rx="6" fill="#cbd5e1" />
    <rect x="612" y="614" width="190" height="12" rx="6" fill="#cbd5e1" />
    <!-- 마우스 포인터 -->
    <path d="M800 600 L800 640 L810 630 L818 648 L826 644 L818 627 L832 627 Z" fill="#1f2937" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <path d="M460 700 L1000 700 L1030 730 Q1032 740 1020 740 L440 740 Q428 740 430 730 Z" fill="url(#laptopBody)" />
    <rect x="680" y="704" width="100" height="8" rx="4" fill="#7c8391" />
  </g>

  <!-- 커피잔 -->
  <g filter="url(#shadow)">
    <ellipse cx="1210" cy="742" rx="96" ry="18" fill="#e9e2d8" />
    <path d="M1150 650 L1270 650 L1262 730 Q1258 742 1246 742 L1174 742 Q1162 742 1158 730 Z" fill="url(#cup)" />
    <ellipse cx="1210" cy="650" rx="60" ry="12" fill="#5a3a26" />
    <path d="M1268 670 Q1300 672 1298 698 Q1296 722 1262 718" fill="none" stroke="#d9d1c6" stroke-width="12" stroke-linecap="round" />
  </g>
  <path d="M1196 630 Q1186 610 1198 592 Q1210 574 1200 556" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" filter="url(#soft)" />
  <path d="M1226 630 Q1216 612 1228 596 Q1238 580 1230 566" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round" filter="url(#soft)" />

  <!-- 왼쪽 화분 -->
  <g filter="url(#shadow)">
    <path d="M230 600 L330 600 L318 690 L242 690 Z" fill="#b35f3e" />
    <path d="M280 600 C 240 540 200 520 180 470 C 230 490 270 530 280 600 Z" fill="#3f7a5a" />
    <path d="M280 600 C 300 530 330 500 370 470 C 360 530 320 570 280 600 Z" fill="#4f8f68" />
    <path d="M280 600 C 270 540 280 490 300 440 C 310 500 300 550 280 600 Z" fill="#356b4e" />
  </g>
</svg>
