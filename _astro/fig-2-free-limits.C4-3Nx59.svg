<!-- 그림 2: 무료 한도를 넘거나 쉴 때 서비스별로 일어나는 일 (느려짐·멈춤·삭제), 2026-11-11 공식 문서 기준 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 784" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">무료 한도를 넘거나 쉴 때 생기는 일</title>
  <desc id="fig2-desc">세 단계로 나눈 비교. 느려짐: Render 무료 웹 서비스는 15분 동안 요청이 없으면 잠들고 깨어나는 데 약 1분, Neon은 5분 뒤 컴퓨트가 0으로 줄어듭니다. 멈춤: Cloudflare Workers는 하루 10만 요청을 넘으면 1027 오류 후 UTC 자정에 재개, Netlify는 300크레딧 소진 시 모든 사이트가 다음 주기까지 중지, Vercel Hobby는 한도를 넘긴 기능을 대부분 30일 뒤 다시 사용, Supabase는 1주 동안 활동이 없으면 프로젝트 일시 중지, Neon은 월 CU-시간이나 전송량 5GB를 넘으면 다음 주기까지 컴퓨트 정지. 삭제: Render 무료 Postgres는 생성 30일 뒤 만료되고 14일 유예 뒤 삭제됩니다.</desc>

  <rect width="1200" height="784" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="782" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="88" font-size="36" font-weight="700" fill="#1e293b">무료 한도를 넘거나 쉴 때 생기는 일</text>
    <text x="64" y="132" font-size="24" fill="#475569">요금이 나가는 대신 느려지거나, 멈추거나, 지워집니다</text>

    <!-- 단계 머리: 왼쪽 열 -->
    <!-- 느려짐 -->
    <rect x="64" y="168" width="1072" height="152" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
    <rect x="64" y="168" width="200" height="152" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <circle cx="112" cy="220" r="20" fill="none" stroke="#475569" stroke-width="3" />
    <path d="M112 208 V220 L120 228" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round" />
    <text x="88" y="284" font-size="28" font-weight="700" fill="#475569">느려짐</text>
    <g font-size="22" fill="#1e293b">
      <text x="296" y="220"><tspan font-weight="700">Render 웹 서비스</tspan>  15분 동안 요청이 없으면 잠듦, 깨어나는 데 약 1분</text>
      <text x="296" y="272"><tspan font-weight="700">Neon</tspan>  5분 동안 쿼리가 없으면 컴퓨트가 0으로, 다음 쿼리에 다시 시작</text>
    </g>

    <!-- 멈춤 -->
    <rect x="64" y="344" width="1072" height="280" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <rect x="64" y="344" width="200" height="280" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
    <rect x="96" y="380" width="12" height="36" rx="3" fill="#b45309" />
    <rect x="116" y="380" width="12" height="36" rx="3" fill="#b45309" />
    <text x="88" y="460" font-size="28" font-weight="700" fill="#b45309">멈춤</text>
    <g font-size="22" fill="#1e293b">
      <text x="296" y="396"><tspan font-weight="700">Cloudflare Workers</tspan>  하루 10만 요청 초과 → 1027 오류, UTC 자정에 재개</text>
      <text x="296" y="444"><tspan font-weight="700">Netlify</tspan>  300크레딧 소진 → 모든 사이트 중지, 다음 결제 주기까지</text>
      <text x="296" y="492"><tspan font-weight="700">Vercel Hobby</tspan>  한도 초과 → 추가 구매 불가, 대부분 30일 뒤 재사용</text>
      <text x="296" y="540"><tspan font-weight="700">Supabase</tspan>  1주 동안 활동 없음 → 프로젝트 일시 중지, 직접 다시 켬</text>
      <text x="296" y="588"><tspan font-weight="700">Neon</tspan>  월 CU-시간·전송량 5GB 초과 → 다음 주기까지 컴퓨트 정지</text>
    </g>

    <!-- 삭제 -->
    <rect x="64" y="648" width="1072" height="104" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <rect x="64" y="648" width="200" height="104" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <path d="M94 672 L118 696 M118 672 L94 696" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" />
    <text x="132" y="694" font-size="28" font-weight="700" fill="#b91c1c">삭제</text>
    <g font-size="22" fill="#1e293b">
      <text x="296" y="694"><tspan font-weight="700">Render 무료 Postgres</tspan>  생성 30일 뒤 만료 → 14일 유예 뒤 삭제</text>
      <text x="296" y="730" fill="#475569">데이터가 사라지므로 오래 쓸 데이터는 다른 DB에 둡니다</text>
    </g>
  </g>
</svg>
